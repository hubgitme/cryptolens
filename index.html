<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحلیل تکنیکال ارز دیجیتال</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg:      #0b0e17;
      --surface: #131722;
      --border:  #1e2535;
      --accent:  #2962ff;
      --green:   #26a69a;
      --red:     #ef5350;
      --yellow:  #ffc107;
      --text:    #d1d4dc;
      --muted:   #6b7280;
      --radius:  10px;
      --font:    'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 700; color: #fff; flex-shrink: 0; }

    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    input, button, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.83rem;
      font-family: var(--font);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button, select { cursor: pointer; }
    button { transition: opacity 0.2s; }
    button:hover { opacity: 0.8; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .iv-group { display: flex; }
    .iv-group button {
      border-radius: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 13px;
    }
    .iv-group button:first-child { border-radius: 6px 0 0 6px; }
    .iv-group button:last-child  { border-radius: 0 6px 6px 0; }
    .iv-group button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    #loadBtn { background: var(--accent); color: #fff; border: none; font-weight: 600; padding: 6px 16px; }

    #status { margin-right: auto; font-size: 0.78rem; color: var(--muted); }

    /* ── Pane Legend — روی خود چارت، بالا-چپ هر پنل (سبک TradingView) ── */
    .pane-legend {
      position: absolute;
      top: 6px; left: 10px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      direction: ltr;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .lg-symbol { color: #fff; font-weight: 700; letter-spacing: 0.3px; }
    .lg-item   { color: var(--muted); display: flex; gap: 3px; align-items: baseline; }
    .lg-val    { color: var(--text); font-weight: 600; }
    .lg-val.up { color: var(--green); }
    .lg-val.dn { color: var(--red); }

    /* ── Layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Signal card */
    .signal-card {
      border-radius: var(--radius);
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
    }
    .signal-card.bearish { background: rgba(239,83,80,0.07);  border-color: rgba(239,83,80,0.4); }
    .signal-card.bullish { background: rgba(38,166,154,0.07); border-color: rgba(38,166,154,0.4); }
    .signal-card.neutral { background: var(--bg); color: var(--muted); text-align: center; padding: 12px; }

    /* نوار وضعیت فشرده (واگرایی خنثی + RSI فعلی)، کنار هم توی pivot-row */
    .status-bar {
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.66rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-bar.neutral { color: var(--muted); }
    .status-bar.rsi-ob { background: rgba(239,83,80,0.12); border-color: rgba(239,83,80,0.4); color: var(--red); }
    .status-bar.rsi-os { background: rgba(38,166,154,0.12); border-color: rgba(38,166,154,0.4); color: var(--green); }
    .status-bar.rsi-n  { color: var(--muted); }
    .status-bar.bearish { background: rgba(239,83,80,0.1);  border-color: rgba(239,83,80,0.4);  color: var(--red); }
    .status-bar.bullish { background: rgba(38,166,154,0.1); border-color: rgba(38,166,154,0.4); color: var(--green); }
    .sidebar.mobile-grid .pivot-row .status-bar { flex: 1 1 0; min-width: 0; box-sizing: border-box; }
    .signal-title { font-weight: 700; font-size: 0.82rem; color: #fff; }
    .signal-desc  { color: var(--muted); font-size: 0.72rem; margin-bottom: 3px; }
    .signal-row   { display: flex; gap: 6px; color: var(--muted); }
    .signal-row span:first-child { flex-shrink: 0; }
    .signal-row span:last-child { color: var(--text); font-weight: 600; }
    em.up { color: var(--green); font-style: normal; }
    em.dn { color: var(--red);   font-style: normal; }

    /* Pivot card */
    .pivot-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.78rem;
    }
    .pivot-card .ptype { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .pivot-card.peak   .ptype { color: var(--red); }
    .pivot-card.valley .ptype { color: var(--green); }
    .pivot-card .price-val { font-size: 1.1rem; font-weight: 700; color: #fff; direction: ltr; }
    .pivot-card .row { display: flex; gap: 6px; color: var(--muted); }
    .pivot-card .row span:first-child { flex-shrink: 0; }
    .pivot-card .row span:last-child { color: var(--text); font-weight: 600; }

    .badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 0.7rem; font-weight: 700;
    }
    .rsi-ob { background: rgba(239,83,80,0.18);  color: var(--red); }
    .rsi-os { background: rgba(38,166,154,0.18); color: var(--green); }
    .rsi-n  { background: rgba(107,114,128,0.15); color: var(--muted); }
    .macd-bull { background: rgba(38,166,154,0.18); color: var(--green); }
    .macd-bear { background: rgba(239,83,80,0.18);  color: var(--red); }

    .no-data { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 16px 0; }

    /* ── این کلاس با JS (نه CSS media query) کنترل میشه، پس مستقل از رفتار مرورگره ── */
    /* ستون‌بندی صریح: هر ردیف (قله+دره) توی یه div جدا با ۲ بچه — مطمئن‌تر از flex-wrap کل سایدبار */
    .sidebar.mobile-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      border-right: none;
      border-top: 1px solid var(--border);
    }
    .sidebar.mobile-grid h2 { font-size: 0.62rem; padding-bottom: 4px; }

    /* ردیف جفتی قله|دره — فقط تو حالت موبایل فعاله */
    .sidebar.mobile-grid .pivot-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .sidebar.mobile-grid .pivot-row .pivot-card {
      flex: 1 1 0;
      min-width: 0;
      box-sizing: border-box;
    }

    .sidebar.mobile-grid .signal-card,
    .sidebar.mobile-grid .pivot-card {
      padding: 7px 9px;
      font-size: 0.66rem;
      gap: 3px;
      box-sizing: border-box;
    }
    .sidebar.mobile-grid .signal-title { font-size: 0.7rem; }
    .sidebar.mobile-grid .signal-desc  { font-size: 0.6rem; }
    .sidebar.mobile-grid .price-val    { font-size: 0.88rem !important; }
    .sidebar.mobile-grid .ptype        { font-size: 0.58rem !important; }
    .sidebar.mobile-grid .badge        { font-size: 0.58rem; padding: 0 4px; }

    /* ── Charts column ── */
    .charts-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden auto;
    }

    .chart-wrap {
      position: relative;
      border-bottom: 1px solid var(--border);
    }
    .chart-wrap:last-child { border-bottom: none; }

    /* ── Loader ── */
    .loader {
      display: none;
      position: fixed; inset: 0;
      background: rgba(11,14,23,0.75);
      align-items: center; justify-content: center;
      z-index: 999; flex-direction: column; gap: 14px;
    }
    .loader.show { display: flex; }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader p { color: var(--muted); font-size: 0.83rem; }

    /* ══════════════════════════════════════════════════════════
       موبایل
       ══════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      header {
        padding: 5px 10px;
        gap: 6px;
        min-height: auto;
      }
      header h1 { font-size: 0.78rem; }

      .controls {
        width: 100%;
        justify-content: flex-start;
        gap: 5px;
      }
      #symbolInput {
        flex: 1 1 80px;
        min-width: 0;
        font-size: 16px;
        padding: 5px 8px;
      }
      #zigzagInput { font-size: 16px; width: 42px; padding: 5px 4px; }
      label[for], .controls label { font-size: 0.68rem; }

      .iv-group button, #loadBtn {
        padding: 5px 9px;
        font-size: 0.72rem;
      }

      #status {
        width: 100%;
        order: 10;
        font-size: 0.62rem;
      }

      /* Legend روی چارت، فشرده‌تر تو موبایل */
      .pane-legend {
        font-size: 0.6rem;
        gap: 6px;
        top: 4px; left: 6px;
      }

      /* توجه: چیدمان اصلی (main/charts-col/sidebar) الان توسط JS (applyLayout) کنترل میشه، نه اینجا */
    }

    @media (max-width: 420px) {
      header h1 { display: none; }
      .iv-group button, #loadBtn { padding: 5px 7px; font-size: 0.68rem; }
    }

    /* ── پنل اندیکاتورها / پشتیبان‌گیری ── */
    .ind-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:1000;
      align-items:flex-start; justify-content:center; padding:16px 8px; overflow-y:auto; }
    .ind-overlay.show { display:flex; }
    .ind-modal { background:var(--surface); border:1px solid var(--border); border-radius:12px;
      width:100%; max-width:580px; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .ind-head { display:flex; align-items:center; justify-content:space-between; }
    .ind-head h3 { font-size:.95rem; color:#fff; }
    .ind-sec { border-top:1px solid var(--border); padding-top:10px; }
    .ind-sec h4 { font-size:.74rem; color:var(--muted); margin-bottom:8px; }
    .ind-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; font-size:.8rem; }
    .ind-row .nm { min-width:84px; font-weight:600; color:#fff; direction:ltr; text-align:right; }
    .ind-row label { display:flex; align-items:center; gap:4px; color:var(--muted); }
    .ind-row input[type=number] { width:64px; direction:ltr; }
    .ind-row input[type=color] { width:34px; height:28px; padding:0; border:none; background:none; }
    .ind-row input[type=checkbox] { accent-color:var(--accent); width:16px; height:16px; }
    .ind-add { display:flex; gap:6px; flex-wrap:wrap; }
    .ind-modal textarea { width:100%; height:64px; direction:ltr; font-size:.72rem; margin-top:8px;
      background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px; resize:vertical; }
    .ind-msg { font-size:.78rem; color:var(--green); min-height:1em; }
  </style>
</head>
<body>

<header>
  <h1>📊 تحلیل تکنیکال</h1>
  <div class="controls">
    <input id="symbolInput" type="text" value="BTCUSDT" style="width:100px; direction:ltr;" />
    <select id="symbolSelect" onchange="onSymbolSelect(this)" style="direction:ltr; max-width:150px;">
      <option value="">— انتخاب سریع —</option>
      <optgroup label="۱۰ ارز برتر" id="topCoinsGroup"></optgroup>
      <optgroup label="ذخیره‌شده‌های من" id="savedCoinsGroup"></optgroup>
    </select>
    <button id="saveSymbolBtn" onclick="saveCurrentSymbol()" title="ذخیره ارز فعلی">⭐ ذخیره</button>
    <div class="iv-group">
      <button onclick="setIv('1h')"  id="btn-1h">1H</button>
      <button onclick="setIv('4h')"  id="btn-4h" class="active">4H</button>
      <button onclick="setIv('1d')"  id="btn-1d">1D</button>
    </div>
    <div style="display:flex; align-items:center; gap:5px;">
      <label style="font-size:0.78rem; color:var(--muted);">حساسیت%</label>
      <input id="zigzagInput" type="number" value="0.5" step="0.1" min="0.1" max="5" style="width:55px; direction:ltr;" onchange="zigzagPct = parseFloat(this.value) || 0.5; saveSettings()" />
    </div>
    <button id="indBtn" onclick="openInd()">📈 اندیکاتورها</button>
    <button id="loadBtn" onclick="loadData()">بارگذاری</button>
  </div>
  <span id="status">آماده</span>
</header>

<div class="main">
  <aside class="sidebar">
    <h2>سیگنال واگرایی</h2>
    <div id="pivotCards"><p class="no-data">داده‌ای بارگذاری نشده</p></div>
  </aside>

  <div class="charts-col" id="chartsCol">
    <div class="chart-wrap" id="wrap-price">
      <div class="pane-legend" id="legend-price">
        <span class="lg-symbol" id="lg-symbol">BTCUSDT · 4H</span>
        <span class="lg-item">O<b id="lg-open" class="lg-val">—</b></span>
        <span class="lg-item">H<b id="lg-high" class="lg-val">—</b></span>
        <span class="lg-item">L<b id="lg-low"  class="lg-val">—</b></span>
        <span class="lg-item">C<b id="lg-close" class="lg-val">—</b></span>
      </div>
      <div class="pane-legend" id="legend-ov" style="top:26px; flex-wrap:wrap; max-width:92%;"></div>
      <div id="chart-price"></div>
    </div>
    <div class="chart-wrap" id="wrap-rsi">
      <div class="pane-legend" id="legend-rsi">
        <span class="lg-symbol" id="lg-rsi-title">RSI (14)</span>
        <b id="lg-rsi" class="lg-val">—</b>
      </div>
      <div id="chart-rsi"></div>
    </div>
    <div class="chart-wrap" id="wrap-macd">
      <div class="pane-legend" id="legend-macd">
        <span class="lg-symbol" id="lg-macd-title">MACD (12,26,9)</span>
        <span class="lg-item" style="color:#2962ff">MACD <b id="lg-macd" class="lg-val">—</b></span>
        <span class="lg-item" style="color:#ff6d00">Signal <b id="lg-signal" class="lg-val">—</b></span>
        <span class="lg-item">Hist <b id="lg-hist" class="lg-val">—</b></span>
      </div>
      <div id="chart-macd"></div>
    </div>
  </div>
</div>

<div class="ind-overlay" id="indOverlay" onclick="if(event.target===this)closeInd()"><div class="ind-modal" id="indModal"></div></div>
<div class="loader" id="loader">

  <div class="spinner"></div>
  <p>در حال دریافت داده از بایننس...</p>
</div>

<script>
// ─── Globals ────────────────────────────────────────────────────────────────
let currentIv = '4h';

// ─── لیست ارزها (۱۰ ارز برتر + ذخیره‌شده‌های کاربر با localStorage) ──────────
const TOP_COINS = ['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','CRVUSDT','ADAUSDT','XLMUSDT','DOGEUSDT','NEARUSDT','TONUSDT','SUIUSDT','PEPEUSDT',];

function getSavedSymbols() {
  try { return JSON.parse(localStorage.getItem('savedSymbols') || '[]'); }
  catch(e) { return []; }
}

function setSavedSymbols(arr) {
  try { localStorage.setItem('savedSymbols', JSON.stringify(arr)); } catch(e) {}
}

function populateSymbolDropdown() {
  const topGroup   = document.getElementById('topCoinsGroup');
  const savedGroup = document.getElementById('savedCoinsGroup');

  topGroup.innerHTML = TOP_COINS.map(s => `<option value="${s}">${s}</option>`).join('');

  const saved = getSavedSymbols();
  savedGroup.innerHTML = saved.length
    ? saved.map(s => `<option value="${s}">${s} ⭐</option>`).join('')
    : '';
  savedGroup.style.display = saved.length ? '' : 'none';
}

function onSymbolSelect(sel) {
  if (!sel.value) return;
  document.getElementById('symbolInput').value = sel.value;
  sel.value = ''; // برگردون به حالت پیش‌فرض تا دوباره قابل انتخاب باشه
  loadData();
}

function saveCurrentSymbol() {
  const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
  if (!symbol) return;
  const saved = getSavedSymbols();
  if (!saved.includes(symbol)) {
    saved.push(symbol);
    setSavedSymbols(saved);
    populateSymbolDropdown();
  }
  document.getElementById('status').textContent = `✅ ${symbol} ذخیره شد`;
}

let zigzagPct = 0.5; // درصد حساسیت تشخیص دره/قله
let priceChart, rsiChart, macdChart;
let candleSeries, rsiSeries, rsiOB, rsiOS, macdLineSeries, macdSignalSeries, macdHistSeries;
let globalCandles = [], globalRsi = [], globalMacdL = [], globalMacdS = [], globalMacdH = [];
let lastPricePrecision = 2;
let isSyncing = false;

// ═══════════ تنظیمات، اندیکاتورها و پشتیبان‌گیری ═══════════
const LS_KEY = 'ta_settings_v1';
const OV_TYPES = { sma: 'SMA', ema: 'EMA', bb: 'Bollinger', vwap: 'VWAP' };
const OV_COLORS = ['#f59e0b', '#3b82f6', '#a855f7', '#14b8a6', '#ec4899', '#84cc16'];
const SYMBOL_RE = /^[A-Za-z0-9]{2,20}$/;
let ovSeq = 0;
let allCharts = [];
let lastCandles = [], lastSymbol = '';
let overlaySeries = [], overlayDefs = [], volSeries = null;
const extraPanes = {}, extraData = {};

function defaultSettings() {
  return {
    v: 1, symbol: 'BTCUSDT', iv: '4h', zigzag: 0.5,
    overlays: [], volume: { on: false },
    rsi:   { on: true, period: 14, ob: 70, os: 30 },
    macd:  { on: true, fast: 12, slow: 26, sig: 9 },
    stoch: { on: false, k: 14, d: 3, smooth: 3 },
    atr:   { on: false, period: 14 },
    customIndicators: []   // جای اندیکاتورهای کدنویسی‌شده (مرحله بعد)
  };
}
let S = defaultSettings();

function toNum(v, def, min, max) { v = parseFloat(v); return isFinite(v) ? Math.min(max, Math.max(min, v)) : def; }
function toInt(v, def, min, max) { return Math.round(toNum(v, def, min, max)); }
function toBool(v, def) { return typeof v === 'boolean' ? v : def; }

// هر ورودی بیرونی (localStorage یا فایل پشتیبان) قبل از استفاده اینجا پاک‌سازی میشه
function sanitizeSettings(raw) {
  const o = defaultSettings();
  if (!raw || typeof raw !== 'object') return o;
  if (typeof raw.symbol === 'string' && SYMBOL_RE.test(raw.symbol)) o.symbol = raw.symbol.toUpperCase();
  if (['1h', '4h', '1d'].includes(raw.iv)) o.iv = raw.iv;
  o.zigzag = toNum(raw.zigzag, 0.5, 0.1, 5);
  if (Array.isArray(raw.overlays)) {
    o.overlays = raw.overlays.slice(0, 12).filter(x => x && OV_TYPES[x.type]).map((x, i) => ({
      id: 'ov' + (++ovSeq), type: x.type, on: toBool(x.on, true),
      period: toInt(x.period, 20, 1, 500), mult: toNum(x.mult, 2, 0.1, 10),
      color: /^#[0-9a-fA-F]{6}$/.test(x.color) ? x.color : OV_COLORS[i % OV_COLORS.length]
    }));
  }
  o.volume.on = toBool(raw.volume && raw.volume.on, false);
  const r = raw.rsi || {};
  o.rsi = { on: toBool(r.on, true), period: toInt(r.period, 14, 2, 200), ob: toNum(r.ob, 70, 50, 100), os: toNum(r.os, 30, 0, 50) };
  if (o.rsi.os >= o.rsi.ob) { o.rsi.ob = 70; o.rsi.os = 30; }
  const m = raw.macd || {};
  o.macd = { on: toBool(m.on, true), fast: toInt(m.fast, 12, 2, 200), slow: toInt(m.slow, 26, 3, 400), sig: toInt(m.sig, 9, 1, 200) };
  if (o.macd.fast >= o.macd.slow) { o.macd.fast = 12; o.macd.slow = 26; }
  const s = raw.stoch || {};
  o.stoch = { on: toBool(s.on, false), k: toInt(s.k, 14, 2, 200), d: toInt(s.d, 3, 1, 50), smooth: toInt(s.smooth, 3, 1, 50) };
  const a = raw.atr || {};
  o.atr = { on: toBool(a.on, false), period: toInt(a.period, 14, 2, 200) };
  if (Array.isArray(raw.customIndicators)) o.customIndicators = raw.customIndicators.slice(0, 50);
  return o;
}

// ─── محاسبات اندیکاتورها ────────────────────────────────────────────────────
function toSeries(times, vals) { return times.map((t, i) => vals[i] != null ? { time: t, value: vals[i] } : null).filter(Boolean); }
function calcSMA(a, p) {
  const out = new Array(a.length).fill(null);
  for (let i = p - 1; i < a.length; i++) {
    let s = 0, ok = true;
    for (let j = i - p + 1; j <= i; j++) { if (a[j] == null) { ok = false; break; } s += a[j]; }
    if (ok) out[i] = s / p;
  }
  return out;
}
function calcEMA(a, p) {
  const k = 2 / (p + 1), out = new Array(a.length).fill(null), sma = calcSMA(a, p);
  let prev = null;
  for (let i = p - 1; i < a.length; i++) {
    if (prev == null) { prev = sma[i]; if (prev == null) continue; }
    else prev = a[i] * k + prev * (1 - k);
    out[i] = prev;
  }
  return out;
}
function calcBB(closes, p, mult) {
  const mid = calcSMA(closes, p), up = [], lo = [];
  mid.forEach((m, i) => {
    if (m == null) { up.push(null); lo.push(null); return; }
    let v = 0; for (let j = i - p + 1; j <= i; j++) v += (closes[j] - m) ** 2;
    const sd = Math.sqrt(v / p);
    up.push(m + mult * sd); lo.push(m - mult * sd);
  });
  return { mid, up, lo };
}
function calcVWAP(c, iv) {   // ریست روزانه (برای 1D ماهانه)
  let pv = 0, vv = 0, key = null;
  return c.map(x => {
    const d = new Date(x.time * 1000);
    const k = d.getUTCFullYear() + '-' + d.getUTCMonth() + (iv === '1d' ? '' : '-' + d.getUTCDate());
    if (k !== key) { key = k; pv = 0; vv = 0; }
    pv += (x.high + x.low + x.close) / 3 * x.volume; vv += x.volume;
    return vv ? pv / vv : null;
  });
}
function calcStoch(c, kp, dp, sm) {
  const raw = c.map((_, i) => {
    if (i < kp - 1) return null;
    let hh = -Infinity, ll = Infinity;
    for (let j = i - kp + 1; j <= i; j++) { hh = Math.max(hh, c[j].high); ll = Math.min(ll, c[j].low); }
    return hh === ll ? 50 : (c[i].close - ll) / (hh - ll) * 100;
  });
  const k = sm > 1 ? calcSMA(raw, sm) : raw;
  return { k, d: calcSMA(k, dp) };
}
function calcATR(c, p) {
  const out = new Array(c.length).fill(null);
  if (c.length < p) return out;
  const tr = c.map((x, i) => i === 0 ? x.high - x.low :
    Math.max(x.high - x.low, Math.abs(x.high - c[i - 1].close), Math.abs(x.low - c[i - 1].close)));
  let a = 0; for (let i = 0; i < p; i++) a += tr[i];
  a /= p; out[p - 1] = a;
  for (let i = p; i < c.length; i++) { a = (a * (p - 1) + tr[i]) / p; out[i] = a; }
  return out;
}

// ─── Chart helpers (مشترک بین پنل‌های اصلی و پنل‌های اضافه) ─────────────────
function baseChartOptions() {
  return {
    layout: { background: { color: '#0b0e17' }, textColor: '#6b7280' },
    grid: { vertLines: { color: '#1e2535' }, horzLines: { color: '#1e2535' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Magnet },
    timeScale: { borderColor: '#1e2535', timeVisible: true, rightOffset: 5, barSpacing: 9 },
    rightPriceScale: { borderColor: '#1e2535' },
    handleScroll: true,
    handleScale: true,
  };
}
function hookSync(src) {
  src.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (isSyncing || !range) return;
    isSyncing = true;
    allCharts.forEach(t => { if (t !== src) { try { t.timeScale().setVisibleLogicalRange(range); } catch (e) {} } });
    isSyncing = false;
  });
}

// ─── Overlay روی نمودار قیمت (SMA/EMA/Bollinger/VWAP/Volume) ─────────────────
function renderOverlays(candles, times) {
  overlaySeries.forEach(s => { try { priceChart.removeSeries(s); } catch (e) {} });
  overlaySeries = []; overlayDefs = [];
  if (volSeries) { try { priceChart.removeSeries(volSeries); } catch (e) {} volSeries = null; }
  const closes = candles.map(c => c.close);
  const line = (vals, color, w, style) => {
    const s = priceChart.addLineSeries({ color, lineWidth: w || 1.5, lineStyle: style || 0,
      priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
    s.setData(toSeries(times, vals)); overlaySeries.push(s);
  };
  S.overlays.filter(o => o.on).forEach(o => {
    if (o.type === 'sma' || o.type === 'ema') {
      const v = o.type === 'sma' ? calcSMA(closes, o.period) : calcEMA(closes, o.period);
      line(v, o.color);
      overlayDefs.push({ label: `${OV_TYPES[o.type]} ${o.period} `, color: o.color, vals: v });
    } else if (o.type === 'bb') {
      const b = calcBB(closes, o.period, o.mult);
      line(b.up, o.color, 1); line(b.lo, o.color, 1); line(b.mid, o.color, 1, 2);
      overlayDefs.push({ label: `BB ${o.period},${o.mult} `, color: o.color, vals: b.mid });
    } else if (o.type === 'vwap') {
      const v = calcVWAP(candles, currentIv);
      line(v, o.color);
      overlayDefs.push({ label: 'VWAP ', color: o.color, vals: v });
    }
  });
  if (S.volume.on) {
    volSeries = priceChart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol',
      lastValueVisible: false, priceLineVisible: false });
    volSeries.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    volSeries.setData(candles.map(c => ({ time: c.time, value: c.volume,
      color: c.close >= c.open ? 'rgba(38,166,154,0.45)' : 'rgba(239,83,80,0.45)' })));
    overlayDefs.push({ label: 'Vol ', color: '#6b7280', vals: candles.map(c => c.volume), compact: true });
  }
}
function updateOverlayLegend(idx) {
  const el = document.getElementById('legend-ov');
  if (!el) return;
  el.innerHTML = overlayDefs.map(d => {
    const v = d.vals[idx];
    const t = v == null ? '—' : v.toLocaleString('en-US',
      d.compact ? { notation: 'compact', maximumFractionDigits: 2 } : { maximumFractionDigits: lastPricePrecision });
    return `<span class="lg-item" style="color:${d.color}">${d.label}<b class="lg-val">${t}</b></span>`;
  }).join('');
}

// ─── پنل‌های اضافه (Stochastic / ATR) — با روشن/خاموش کردن ساخته یا حذف میشن ──
const fx = v => v != null ? (Math.abs(v) < 1 ? v.toPrecision(4) : v.toFixed(2)) : '—';
const EXTRA_DEFS = {
  stoch: {
    title: () => `Stoch (${S.stoch.k},${S.stoch.d},${S.stoch.smooth})`,
    build(ch) {
      const k = ch.addLineSeries({ color: '#2962ff', lineWidth: 1.5, priceLineVisible: false });
      const d = ch.addLineSeries({ color: '#ff6d00', lineWidth: 1.5, priceLineVisible: false });
      [80, 20].forEach(p => k.createPriceLine({ price: p, color: '#6b7280', lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
      return { k, d };
    },
    compute: c => calcStoch(c, S.stoch.k, S.stoch.d, S.stoch.smooth),
    fill(sr, data, t) { sr.k.setData(toSeries(t, data.k)); sr.d.setData(toSeries(t, data.d)); },
    legend: (data, i) => `<span style="color:#2962ff">%K ${fx(data.k[i])}</span> <span style="color:#ff6d00">%D ${fx(data.d[i])}</span>`
  },
  atr: {
    title: () => `ATR (${S.atr.period})`,
    build(ch) { return { a: ch.addLineSeries({ color: '#ffc107', lineWidth: 1.5, priceLineVisible: false }) }; },
    compute: c => ({ a: calcATR(c, S.atr.period) }),
    fill(sr, data, t) { sr.a.setData(toSeries(t, data.a)); },
    legend: (data, i) => `<span style="color:#ffc107">${fx(data.a[i])}</span>`
  }
};
function syncExtraPane(key, on) {
  if (on && !extraPanes[key]) {
    const wrap = document.createElement('div');
    wrap.className = 'chart-wrap'; wrap.id = 'wrap-' + key;
    wrap.innerHTML = `<div class="pane-legend"><span class="lg-symbol" id="lg-${key}-title"></span><span class="lg-item" id="lg-${key}-vals"></span></div><div id="chart-${key}"></div>`;
    document.getElementById('chartsCol').appendChild(wrap);
    const el = document.getElementById('chart-' + key);
    el.style.height = '140px';
    const chart = LightweightCharts.createChart(el, { ...baseChartOptions(), height: 140 });
    const series = EXTRA_DEFS[key].build(chart);
    extraPanes[key] = { chart, wrap, series };
    allCharts.push(chart); hookSync(chart);
    chart.subscribeCrosshairMove(param => {
      if (!param.time) { if (!isSyncing) showLastLegend(); return; }
      const idx = globalCandles.findIndex(c => c.time === param.time);
      if (idx !== -1) updateLegendByIndex(idx);
    });
    const r = priceChart && priceChart.timeScale().getVisibleLogicalRange();
    if (r) { try { chart.timeScale().setVisibleLogicalRange(r); } catch (e) {} }
  } else if (!on && extraPanes[key]) {
    const p = extraPanes[key];
    allCharts = allCharts.filter(c => c !== p.chart);
    p.chart.remove(); p.wrap.remove();
    delete extraPanes[key]; delete extraData[key];
  }
  if (extraPanes[key]) document.getElementById(`lg-${key}-title`).textContent = EXTRA_DEFS[key].title();
}
function renderExtras(candles, times) {
  Object.keys(extraPanes).forEach(k => {
    const def = EXTRA_DEFS[k];
    extraData[k] = def.compute(candles);
    def.fill(extraPanes[k].series, extraData[k], times);
    document.getElementById(`lg-${k}-title`).textContent = def.title();
  });
}
function updateExtraLegends(idx) {
  Object.keys(extraPanes).forEach(k => {
    if (!extraData[k]) return;
    document.getElementById(`lg-${k}-vals`).innerHTML = EXTRA_DEFS[k].legend(extraData[k], idx);
  });
}
function applyIndicatorVisibility() {
  document.getElementById('wrap-rsi').style.display = S.rsi.on ? '' : 'none';
  document.getElementById('wrap-macd').style.display = S.macd.on ? '' : 'none';

// ─── پنل تنظیمات اندیکاتورها ────────────────────────────────────────────────
function onIndChange() {

}
function addOv(type) {
  if (S.overlays.length >= 12) return msg('حداکثر ۱۲ اندیکاتور');
  S.overlays.push({ id: 'ov' + (++ovSeq), type, on: true, period: type === 'vwap' ? 1 : 20, mult: 2,
    color: OV_COLORS[S.overlays.length % OV_COLORS.length] });
  onIndChange();
}
function delOv(id) { S.overlays = S.overlays.filter(o => o.id !== id); onIndChange(); }
function updOv(id, prop, val) {
  const o = S.overlays.find(x => x.id === id); if (!o) return;
  if (prop === 'on') o.on = !!val;
  else if (prop === 'period') o.period = toInt(val, o.period, 1, 500);
  else if (prop === 'mult') o.mult = toNum(val, o.mult, 0.1, 10);
  else if (prop === 'color' && /^#[0-9a-fA-F]{6}$/.test(val)) o.color = val;
  onIndChange();
}
function updPane(key, prop, val) {

  S = sanitizeSettings(S);
  onIndChange();
}
function openInd() { renderPanel(); document.getElementById('indOverlay').classList.add('show'); }
function closeInd() { document.getElementById('indOverlay').classList.remove('show'); }
function fld(key, prop, label, attrs) {

}
function paneRow(key, title, fields) {

}
function renderPanel() {
  const ovRows = S.overlays.map(o => `<div class="ind-row">
      <input type="checkbox" ${o.on ? 'checked' : ''} onchange="updOv('${o.id}','on',this.checked)">

      ${o.type === 'vwap' ? '' : `<label>دوره<input type="number" min="1" max="500" value="${o.period}" onchange="updOv('${o.id}','period',this.value)"></label>`}
      ${o.type === 'bb' ? `<label>ضریب<input type="number" step="0.1" min="0.1" max="10" value="${o.mult}" onchange="updOv('${o.id}','mult',this.value)"></label>` : ''}

    || '<p class="no-data">هنوز اندیکاتوری روی نمودار قیمت اضافه نشده</p>';
  document.getElementById('indModal').innerHTML = `
    <div class="ind-head"><h3>📈 اندیکاتورها و تنظیمات</h3><button onclick="closeInd()">✕</button></div>
    <div class="ind-sec"><h4>روی نمودار قیمت</h4>${ovRows}

      ${paneRow('macd', 'MACD', fld('macd', 'fast', 'سریع', 'min="2"') + fld('macd', 'slow', 'کند', 'min="3"') + fld('macd', 'sig', 'سیگنال', 'min="1"'))}
      ${paneRow('stoch', 'Stochastic', fld('stoch', 'k', 'K', 'min="2"') + fld('stoch', 'd', 'D', 'min="1"') + fld('stoch', 'smooth', 'نرم‌سازی', 'min="1"'))}

      </div>
      <input type="file" id="restoreFile" accept=".json,application/json" hidden onchange="restoreFromFile(this)">

      <div class="ind-add" style="margin-top:6px"><button onclick="restoreFromText(document.getElementById('restoreText').value)">بازیابی از متن</button></div>

}

// ─── پشتیبان‌گیری / بازیابی ─────────────────────────────────────────────────
function buildBackup() {
  saveSettings();
  return { app: 'ta-dashboard', version: 1, exportedAt: new Date().toISOString(),
           settings: S, savedSymbols: getSavedSymbols() };
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(buildBackup(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ta-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  msg('✅ فایل پشتیبان دانلود شد');
}
function copyBackup() {
  const json = JSON.stringify(buildBackup());
  const fallback = () => { const t = document.getElementById('restoreText'); t.value = json; t.select(); msg('متن در کادر پایین قرار گرفت؛ کپی کنید'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(() => msg('✅ کپی شد'), fallback);
  else fallback();
}
function restoreFromText(text) {
  let data;
  try { data = JSON.parse(text); } catch (e) { return msg('❌ متن/فایل JSON معتبر نیست'); }
  if (!data || data.app !== 'ta-dashboard' || !data.settings) return msg('❌ این فایل، پشتیبان این برنامه نیست');
  if (!confirm('تنظیمات فعلی با پشتیبان جایگزین شود؟')) return;
  S = sanitizeSettings(data.settings);
  if (Array.isArray(data.savedSymbols)) {
    const clean = [...new Set(data.savedSymbols.filter(s => typeof s === 'string' && SYMBOL_RE.test(s)).map(s => s.toUpperCase()))].slice(0, 100);
    setSavedSymbols(clean); populateSymbolDropdown();
  }
  applySettingsToUI(); saveSettings(); applyIndicatorVisibility(); renderPanel();
  if (lastCandles.length) renderAll(false);
  msg('✅ بازیابی انجام شد');
}
function restoreFromFile(inp) {
  const f = inp.files[0]; if (!f) return;
  if (f.size > 2e6) { inp.value = ''; return msg('❌ فایل خیلی بزرگ است'); }
  const r = new FileReader();
  r.onload = () => restoreFromText(String(r.result));
  r.readAsText(f); inp.value = '';
}
function resetSettings() {
  if (!confirm('همه تنظیمات اندیکاتورها به حالت پیش‌فرض برگردد؟ (ارزهای ذخیره‌شده حفظ می‌شوند)')) return;
  const keep = { symbol: S.symbol, iv: S.iv, zigzag: S.zigzag };
  S = sanitizeSettings(Object.assign(defaultSettings(), keep));
  saveSettings(); applyIndicatorVisibility(); renderPanel();
  if (lastCandles.length) renderAll(false);
  msg('↺ بازنشانی شد');
}

// ─── Interval ───────────────────────────────────────────────────────────────

// ─── چیدمان موبایل — مستقل از CSS media query، مستقیم با JS اعمال میشه ──────
// (بعضی مرورگرها/وب‌ویوها عرض واقعی صفحه رو درست به CSS گزارش نمی‌دن)
function applyResponsiveLayout() {
  const isMobile = window.innerWidth <= 768;
  const main      = document.querySelector('.main');
  const chartsCol = document.getElementById('chartsCol');
  const sidebar   = document.querySelector('.sidebar');

  if (isMobile) {
    main.style.flexDirection = 'column';
    main.style.overflow = 'hidden';

    chartsCol.style.order  = '1';
    chartsCol.style.flex   = '0 0 62vh';
    chartsCol.style.height = '62vh';
    chartsCol.style.overflow = 'hidden auto';

    sidebar.style.order = '2';
    sidebar.classList.add('mobile-grid');
  } else {
    main.style.flexDirection = '';
    main.style.overflow = '';

    chartsCol.style.order  = '';
    chartsCol.style.flex   = '';
    chartsCol.style.height = '';
    chartsCol.style.overflow = '';

    sidebar.style.order = '';
    sidebar.classList.remove('mobile-grid');
  }
}

// ─── Chart heights ──────────────────────────────────────────────────────────
function visiblePaneKeys() {
  const k = ['price'];
  if (S.rsi.on) k.push('rsi');
  if (S.macd.on) k.push('macd');
  Object.keys(extraPanes).forEach(x => k.push(x));
  return k;
}
function calcHeights() {
  const total = Math.max(document.getElementById('chartsCol').clientHeight, 420);
  const keys = visiblePaneKeys();
  const wt = k => k === 'price' ? 4 : 2.6;
  const sum = keys.reduce((s, k) => s + wt(k), 0);
  const out = {};
  keys.forEach(k => { out[k] = Math.max(k === 'price' ? 240 : 120, Math.floor(total * wt(k) / sum)); });
  return out;
}

// ─── Init Charts ────────────────────────────────────────────────────────────
function initCharts() {
  const h = calcHeights();

  const base = baseChartOptions();
  // Price (candlestick)
  document.getElementById('chart-price').style.height = h.price + 'px';
  priceChart = LightweightCharts.createChart(document.getElementById('chart-price'), { ...base, height: h.price });
  candleSeries = priceChart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    priceFormat: { type: 'price', precision: 4, minMove: 0.01 }, // ← تعداد رقم اعشار قیمت اینجا
  });

  // RSI
  document.getElementById('chart-rsi').style.height = h.rsi + 'px';
  rsiChart = LightweightCharts.createChart(document.getElementById('chart-rsi'), { ...base, height: h.rsi });
  rsiSeries = rsiChart.addLineSeries({ color: '#ffc107', lineWidth: 1.5 });
  rsiOB = rsiChart.addLineSeries({ color: '#ef5350', lineWidth: 1, lineStyle: 2 });
  rsiOS = rsiChart.addLineSeries({ color: '#26a69a', lineWidth: 1, lineStyle: 2 });

  // MACD
  document.getElementById('chart-macd').style.height = h.macd + 'px';
  macdChart = LightweightCharts.createChart(document.getElementById('chart-macd'), { ...base, height: h.macd });
  macdLineSeries   = macdChart.addLineSeries({ color: '#2962ff', lineWidth: 1.5 });
  macdSignalSeries = macdChart.addLineSeries({ color: '#ff6d00', lineWidth: 1.5 });
  macdHistSeries   = macdChart.addHistogramSeries({ priceFormat: { type: 'price', precision: 4 } });

  allCharts = [priceChart, rsiChart, macdChart];
  allCharts.forEach(hookSync);
  // ── Crosshair sync + tooltip ──
  function syncCrosshair(src, targets, getTooltip) {
    src.subscribeCrosshairMove(param => {
      // Sync crosshair to other charts
      if (param.time) {
        targets.forEach(t => {
          t.setCrosshairPosition(
            param.seriesData?.values()?.next()?.value?.value ?? 0,
            param.time,
            t.series?.[0]
          );
        });
      } else {
        targets.forEach(t => t.clearCrosshairPosition());
      }
      // Update tooltip bar
      if (param.time && getTooltip) getTooltip(param);
    });
  }

  // crosshair on price chart drives legend
  priceChart.subscribeCrosshairMove(param => {
    if (!param.time) { showLastLegend(); return; }
    const idx = globalCandles.findIndex(c => c.time === param.time);
    if (idx === -1) return;
    updateLegendByIndex(idx);

    // sync crosshair position on rsi and macd charts
    if (!isSyncing) {
      isSyncing = true;
      const rsi = globalRsi[idx], ml = globalMacdL[idx];
      if (rsi != null) { try { rsiChart.setCrosshairPosition(rsi, param.time, rsiSeries); } catch(e){} }
      if (ml  != null) { try { macdChart.setCrosshairPosition(ml, param.time, macdLineSeries); } catch(e){} }
      isSyncing = false;
    }
  });

  rsiChart.subscribeCrosshairMove(param => {
    if (!param.time) { if (!isSyncing) showLastLegend(); return; }
    if (isSyncing) return;
    isSyncing = true;
    try { priceChart.setCrosshairPosition(0, param.time, candleSeries); } catch(e){}
    try { macdChart.setCrosshairPosition(0, param.time, macdLineSeries); } catch(e){}
    isSyncing = false;
    const idx = globalCandles.findIndex(c => c.time === param.time);
    if (idx !== -1) updateLegendByIndex(idx);
  });

  macdChart.subscribeCrosshairMove(param => {
    if (!param.time) { if (!isSyncing) showLastLegend(); return; }
    if (isSyncing) return;
    isSyncing = true;
    try { priceChart.setCrosshairPosition(0, param.time, candleSeries); } catch(e){}
    try { rsiChart.setCrosshairPosition(0, param.time, rsiSeries); } catch(e){}
    isSyncing = false;
    const idx = globalCandles.findIndex(c => c.time === param.time);
    if (idx !== -1) updateLegendByIndex(idx);
  });
}

  const ml  = globalMacdL[idx];

}

// ─── Indicators ──────────────────────────────────────────────────────────────
function calcRSI(closes, period = 14) {
  const rsi = new Array(closes.length).fill(null);
  let g = 0, l = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i-1];
    d >= 0 ? g += d : l -= d;
  }
  let ag = g / period, al = l / period;
  rsi[period] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    ag = (ag * (period-1) + Math.max(d, 0)) / period;
    al = (al * (period-1) + Math.max(-d, 0)) / period;
    rsi[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  }
  return rsi;
}

function ema(arr, p) {
  const k = 2 / (p + 1), out = new Array(arr.length).fill(null);
  let s = 0; while (s < arr.length && arr[s] == null) s++;
  out[s] = arr[s];
  for (let i = s+1; i < arr.length; i++)
    out[i] = arr[i] != null ? arr[i] * k + out[i-1] * (1-k) : null;
  return out;
}

function calcMACD(closes, fast=12, slow=26, sig=9) {
  const ef = ema(closes, fast), es = ema(closes, slow);
  const ml = closes.map((_,i) => ef[i]!=null && es[i]!=null ? ef[i]-es[i] : null);
  const sl = ema(ml, sig);
  const hl = ml.map((v,i) => v!=null && sl[i]!=null ? v-sl[i] : null);
  return { ml, sl, hl };
}

// ─── ZigZag Pivots (بر اساس قیمت بسته شدن، نه سایه کندل) ─────────────────────
function calcZigZag(candles, deviationPct = 0.5) {
  const pivots = [];
  if (candles.length < 2) return pivots;

  let direction = 0; // 0=unknown, 1=up-tracking(looking for high), -1=down-tracking
  let anchorIdx = 0;
  let anchorPrice = candles[0].close;

  for (let i = 1; i < candles.length; i++) {
    const cp = candles[i].close;

    if (direction === 0) {
      const upPct   = (cp - anchorPrice) / anchorPrice * 100;
      const downPct = (anchorPrice - cp) / anchorPrice * 100;
      if (upPct >= deviationPct) {
        pivots.push({ idx: 0, type: 'low', price: candles[0].close });
        direction = 1; anchorPrice = cp; anchorIdx = i;
      } else if (downPct >= deviationPct) {
        pivots.push({ idx: 0, type: 'high', price: candles[0].close });
        direction = -1; anchorPrice = cp; anchorIdx = i;
      }
      continue;
    }

    if (direction === 1) {
      if (cp >= anchorPrice) { anchorPrice = cp; anchorIdx = i; }
      const retrace = (anchorPrice - cp) / anchorPrice * 100;
      if (retrace >= deviationPct) {
        pivots.push({ idx: anchorIdx, type: 'high', price: anchorPrice });
        direction = -1; anchorPrice = cp; anchorIdx = i;
      }
    } else {
      if (cp <= anchorPrice) { anchorPrice = cp; anchorIdx = i; }
      const retrace = (cp - anchorPrice) / anchorPrice * 100;
      if (retrace >= deviationPct) {
        pivots.push({ idx: anchorIdx, type: 'low', price: anchorPrice });
        direction = 1; anchorPrice = cp; anchorIdx = i;
      }
    }
  }

  const peaks   = pivots.filter(p => p.type === 'high').map(p => p.idx);
  const valleys = pivots.filter(p => p.type === 'low').map(p => p.idx);
  return { peaks, valleys };
}

// ─── Divergence — تعریف جدید:
// نزولی: کلوز فعلی >= کلوز آخرین قله   و   RSI فعلی < RSI آخرین دره
// صعودی: کلوز فعلی <= کلوز آخرین دره   و   RSI فعلی > RSI آخرین قله
function detectDivergence({ candles, rsiArr, peaks, valleys }) {
  const result = { bearish: null, bullish: null };

  if (!peaks.length || !valleys.length) return result;

  const lastIdx = candles.length - 1;
  const currentClose = candles[lastIdx].close;
  const currentRsi   = rsiArr[lastIdx];
  if (currentRsi == null) return result;

  const lastPeakIdx   = peaks[peaks.length - 1];
  const lastValleyIdx = valleys[valleys.length - 1];
  const peakClose   = candles[lastPeakIdx].close;
  const peakRsi     = rsiArr[lastPeakIdx];
  const valleyClose = candles[lastValleyIdx].close;
  const valleyRsi   = rsiArr[lastValleyIdx];

  // نزولی
  if (valleyRsi != null && currentClose >= peakClose && currentRsi < valleyRsi) {
    result.bearish = {
      peakIdx: lastPeakIdx, valleyIdx: lastValleyIdx, currentIdx: lastIdx,
      peakClose, currentClose, valleyRsi, currentRsi,
      priceDiff: ((currentClose - peakClose) / peakClose * 100).toFixed(2),
      rsiDiff: (currentRsi - valleyRsi).toFixed(2),
    };
  }

  // صعودی
  if (peakRsi != null && currentClose <= valleyClose && currentRsi > peakRsi) {
    result.bullish = {
      peakIdx: lastPeakIdx, valleyIdx: lastValleyIdx, currentIdx: lastIdx,
      valleyClose, currentClose, peakRsi, currentRsi,
      priceDiff: ((currentClose - valleyClose) / valleyClose * 100).toFixed(2),
      rsiDiff: (currentRsi - peakRsi).toFixed(2),
    };
  }

  return result;
}

// ─── Load ────────────────────────────────────────────────────────────────────
async function loadData() {
  const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
  if (!symbol) return;

  // موبایل: کیبورد رو ببند و اندازه چارت‌ها رو دوباره حساب کن، چون کیبورد ارتفاع صفحه رو موقتاً عوض می‌کنه
  document.activeElement && document.activeElement.blur();

  saveSettings();
  document.getElementById('loader').classList.add('show');
  document.getElementById('loadBtn').disabled = true;
  document.getElementById('status').textContent = 'در حال دریافت...';

  try {
    const res = await fetch(`/api/klines?symbol=${symbol}&interval=${currentIv}&limit=300`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'خطا در دریافت داده');

    lastCandles = json.data; lastSymbol = symbol;
    renderAll(true);
  } catch(e) {
    document.getElementById('status').textContent = '❌ ' + e.message;
  } finally {
    document.getElementById('loader').classList.remove('show');
    document.getElementById('loadBtn').disabled = false;
  }
}

function renderAll(resetView) {
  const symbol = lastSymbol, candles = lastCandles;
  if (!candles.length) return;
  try {

    const closes = candles.map(c => c.close);
    const times  = candles.map(c => c.time);
    const rsiArr = calcRSI(closes, S.rsi.period);
    const { ml, sl, hl } = calcMACD(closes, S.macd.fast, S.macd.slow, S.macd.sig);

    // Store globally for tooltip
    globalCandles = candles;
    globalRsi  = rsiArr;
    globalMacdL = ml;
    globalMacdS = sl;
    globalMacdH = hl;

    const { peaks, valleys } = calcZigZag(candles, zigzagPct);

    // ── تعداد رقم اعشار بر اساس قیمت: زیر ۱ دلار → ۴ رقم، بالاتر → ۲ رقم ──
    const lastPrice = closes[closes.length - 1];
    const isSmallPrice = lastPrice < 1;
    lastPricePrecision = isSmallPrice ? 4 : 2;
    candleSeries.applyOptions({
      priceFormat: {
        type: 'price',
        precision: lastPricePrecision,
        minMove:   isSmallPrice ? 0.0001 : 0.01,
      }
    });

    // ── Candlestick ──
    candleSeries.setData(candles);

    // رفع باگ مهم: بعد از تغییر ارز، محور قیمت گاهی رنج قیمت قبلی رو نگه می‌داشت
    // (مثلاً از ارزی با قیمت ۰.۲ به ارزی با قیمت ۰.۰۷ سوییچ می‌کردی، کندل‌ها بیرون از دید می‌رفتن)
    priceChart.priceScale('right').applyOptions({ autoScale: true });

    // Markers
    const markers = [];
    peaks.slice(-3).forEach((i, idx, arr) => {
      const label = idx === arr.length - 1 ? 'قله' : `قله-${arr.length - idx}`;
      markers.push({ time: times[i], position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: label });
    });
    valleys.slice(-3).forEach((i, idx, arr) => {
      const label = idx === arr.length - 1 ? 'دره' : `دره-${arr.length - idx}`;
      markers.push({ time: times[i], position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: label });
    });

    const divergence = detectDivergence({ candles, rsiArr, peaks, valleys });

    // سیگنال واگرایی فعلی (اگه پیدا شده باشه) رو روی چارت علامت بزن
    if (divergence.bearish) {
      markers.push({ time: times[divergence.bearish.currentIdx], position: 'aboveBar', color: '#ff1744', shape: 'arrowDown', text: '⚠ نزولی' });
    }
    if (divergence.bullish) {
      markers.push({ time: times[divergence.bullish.currentIdx], position: 'belowBar', color: '#00e676', shape: 'arrowUp', text: '⚠ صعودی' });
    }
    markers.sort((a,b) => a.time - b.time);
    candleSeries.setMarkers(markers);

    // ── RSI ──
    // همه بازه رو پوشش بده تا timescale یکی باشه
    rsiSeries.setData(times.map((t,i) => rsiArr[i]!=null ? {time:t, value:rsiArr[i]} : null).filter(Boolean));
    rsiOB.setData(times.map(t => ({time:t, value:S.rsi.ob})));
    rsiOS.setData(times.map(t => ({time:t, value:S.rsi.os})));

    // مارکر سیگنال واگرایی روی RSI هم
    const rsiMarkers = [];
    if (divergence.bearish) {
      rsiMarkers.push({ time: times[divergence.bearish.currentIdx], position: 'aboveBar', color: '#ff1744', shape: 'arrowDown', text: '⚠ نزولی' });
      rsiMarkers.push({ time: times[divergence.bearish.valleyIdx], position: 'belowBar', color: '#ffc107', shape: 'circle' });
    }
    if (divergence.bullish) {
      rsiMarkers.push({ time: times[divergence.bullish.currentIdx], position: 'belowBar', color: '#00e676', shape: 'arrowUp', text: '⚠ صعودی' });
      rsiMarkers.push({ time: times[divergence.bullish.peakIdx], position: 'aboveBar', color: '#ffc107', shape: 'circle' });
    }
    rsiMarkers.sort((a,b) => a.time - b.time);
    rsiSeries.setMarkers(rsiMarkers);

    // ── MACD ──
    macdLineSeries.setData(times.map((t,i)   => ml[i]!=null ? {time:t,value:ml[i]} : null).filter(Boolean));
    macdSignalSeries.setData(times.map((t,i) => sl[i]!=null ? {time:t,value:sl[i]} : null).filter(Boolean));
    macdHistSeries.setData(times.map((t,i)   => hl[i]!=null ? {time:t,value:hl[i],color:hl[i]>=0?'#26a69a':'#ef5350'} : null).filter(Boolean));

    renderOverlays(candles, times);
    renderExtras(candles, times);
    // ── Sidebar ──
    renderSidebar({ candles, rsiArr, ml, sl, peaks, valleys, divergence });

    // Legend: نماد + تایم‌فریم + مقادیر آخرین کندل (پیش‌فرض بدون crosshair)
    document.getElementById('lg-symbol').textContent = `${symbol} · ${currentIv.toUpperCase()}`;
    showLastLegend();

    // اندازه چارت‌ها رو دوباره حساب کن (کیبورد موبایل ممکنه ارتفاع صفحه رو عوض کرده باشه)
    resizeChartsNow();

    // به‌جای fitContent (که همه ۳۰۰ کندل رو له می‌کنه تو صفحه)، فقط آخرین کندل‌های اخیر با زوم مناسب نشون داده میشه
    rsiChart.priceScale('right').applyOptions({ autoScale: true });
    macdChart.priceScale('right').applyOptions({ autoScale: true });
    if (resetView) {
    const barsToShow = window.innerWidth <= 768 ? 55 : 120;
    const totalBars = candles.length;
    priceChart.timeScale().setVisibleLogicalRange({
      from: Math.max(0, totalBars - barsToShow),
      to:   totalBars + 3,
    });
    }
    document.getElementById('status').textContent = `${symbol} · ${currentIv} · ${candles.length} کندل`;
  } catch(e) {
    document.getElementById('status').textContent = '❌ ' + e.message;
  }
}
// ─── Sidebar ─────────────────────────────────────────────────────────────────
function renderSidebar({ candles, rsiArr, ml, sl, peaks, valleys, divergence }) {
  const fmt  = v => v?.toLocaleString('en-US', {maximumFractionDigits:2}) ?? '—';
  const fmtD = t => new Date(t*1000).toLocaleDateString('fa-IR');

  const rsiClass = v => v==null?'':v>=S.rsi.ob?'rsi-ob':v<=S.rsi.os?'rsi-os':'rsi-n';
  const rsiLbl   = v => v==null?'—':v>=S.rsi.ob?'اشباع خرید':v<=S.rsi.os?'اشباع فروش':'خنثی';
  const macdClass = i => ml[i]==null||sl[i]==null?'':ml[i]>sl[i]?'macd-bull':'macd-bear';
  const macdLbl   = i => ml[i]==null||sl[i]==null?'—':ml[i]>sl[i]?'صعودی':'نزولی';

  let html = '';

  // Signal — هر سه حالت (نزولی/صعودی/خنثی) به‌صورت یکسان، نواری و فشرده
  if (divergence.bearish) {
    const d = divergence.bearish;
    html += `<div class="pivot-row">
      <div class="status-bar bearish">🔴 نزولی: قله$${fmt(d.peakClose)}→کلوز$${fmt(d.currentClose)} (${d.priceDiff}%)</div>
      <div class="status-bar bearish">RSI: دره${(+d.valleyRsi).toFixed(1)}→فعلی${(+d.currentRsi).toFixed(1)} (${d.rsiDiff})</div>
    </div>`;
  }
  if (divergence.bullish) {
    const d = divergence.bullish;
    html += `<div class="pivot-row">
      <div class="status-bar bullish">🟢 صعودی: دره$${fmt(d.valleyClose)}→کلوز$${fmt(d.currentClose)} (${d.priceDiff}%)</div>
      <div class="status-bar bullish">RSI: قله${(+d.peakRsi).toFixed(1)}→فعلی${(+d.currentRsi).toFixed(1)} (+${d.rsiDiff})</div>
    </div>`;
  }
  if (!divergence.bearish && !divergence.bullish) {
    const lastRsi = rsiArr[rsiArr.length - 1];
    html += `<div class="pivot-row">
      <div class="status-bar neutral">⚪ واگرایی شناسایی نشد</div>
      <div class="status-bar ${rsiClass(lastRsi)}">RSI فعلی: ${lastRsi!=null?lastRsi.toFixed(1):'—'} · ${rsiLbl(lastRsi)}</div>
    </div>`;
  }

  // قله‌ها و دره‌ها به صورت جفت (قله | دره) توی هر ردیف کنار هم
  const lastPeaks   = peaks.slice(-3).reverse();
  const lastValleys = valleys.slice(-3).reverse();
  const pairCount = Math.max(lastPeaks.length, lastValleys.length);

  function peakCardHtml(i, idx) {
    const c = candles[i], rv = rsiArr[i];
    const label = idx === 0 ? 'آخرین قله' : `قله ${idx + 1} دوره قبل`;
    return `<div class="pivot-card peak">
      <div class="ptype">▼ ${label}</div>
      <div class="price-val">$${fmt(c.close)}</div>
      <div class="row"><span>تاریخ</span><span>${fmtD(c.time)}</span></div>
      <div class="row"><span>RSI</span><span>${rv!=null?rv.toFixed(1):'—'} <span class="badge ${rsiClass(rv)}">${rsiLbl(rv)}</span></span></div>
      <div class="row"><span>MACD</span><span>${ml[i]!=null?ml[i].toFixed(3):'—'} <span class="badge ${macdClass(i)}">${macdLbl(i)}</span></span></div>
    </div>`;
  }

  function valleyCardHtml(i, idx) {
    const c = candles[i], rv = rsiArr[i];
    const label = idx === 0 ? 'آخرین دره' : `دره ${idx + 1} دوره قبل`;
    return `<div class="pivot-card valley">
      <div class="ptype">▲ ${label}</div>
      <div class="price-val">$${fmt(c.close)}</div>
      <div class="row"><span>تاریخ</span><span>${fmtD(c.time)}</span></div>
      <div class="row"><span>RSI</span><span>${rv!=null?rv.toFixed(1):'—'} <span class="badge ${rsiClass(rv)}">${rsiLbl(rv)}</span></span></div>
      <div class="row"><span>MACD</span><span>${ml[i]!=null?ml[i].toFixed(3):'—'} <span class="badge ${macdClass(i)}">${macdLbl(i)}</span></span></div>
    </div>`;
  }

  for (let idx = 0; idx < pairCount; idx++) {
    const peakHtml   = lastPeaks[idx]   != null ? peakCardHtml(lastPeaks[idx], idx)     : '<div></div>';
    const valleyHtml = lastValleys[idx] != null ? valleyCardHtml(lastValleys[idx], idx) : '<div></div>';
    html += `<div class="pivot-row">${peakHtml}${valleyHtml}</div>`;
  }

  document.getElementById('pivotCards').innerHTML = html || '<p class="no-data">Pivot پیدا نشد</p>';
}

// ─── Boot ────────────────────────────────────────────────────────────────────
applyResponsiveLayout();
loadSettings();
initCharts();
populateSymbolDropdown();
applyIndicatorVisibility();
// لایه محافظ: دوباره روی window.load هم اجرا میشه، برای اطمینان بیشتر
window.addEventListener('load', applyResponsiveLayout);
</script>

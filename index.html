<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحلیل تکنیکال ارز دیجیتال</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg:       #0b0e17;
      --surface:  #131722;
      --border:   #1e2535;
      --accent:   #2962ff;
      --green:    #26a69a;
      --red:      #ef5350;
      --yellow:   #ffc107;
      --text:     #d1d4dc;
      --muted:    #6b7280;
      --radius:   10px;
      --font:     'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    input, select, button {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 12px;
      font-size: 0.85rem;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus { border-color: var(--accent); }

    button {
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
      padding: 8px 18px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .interval-group {
      display: flex;
      gap: 0;
    }
    .interval-group button {
      border-radius: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
    }
    .interval-group button:first-child { border-radius: 6px 0 0 6px; }
    .interval-group button:last-child  { border-radius: 0 6px 6px 0; }
    .interval-group button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    #status {
      margin-right: auto;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .main {
      display: flex;
      flex: 1;
      gap: 0;
    }

    .charts-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chart-wrap {
      position: relative;
      border-bottom: 1px solid var(--border);
    }

    .chart-label {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 10;
      pointer-events: none;
    }

    #chart-price  { height: 380px; }
    #chart-rsi    { height: 160px; }
    #chart-macd   { height: 160px; }

    .sidebar {
      width: 270px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .pivot-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pivot-card .type {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .pivot-card.peak .type { color: var(--red); }
    .pivot-card.valley .type { color: var(--green); }

    .pivot-card .price-val {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fff;
      direction: ltr;
      text-align: left;
    }

    .pivot-card .row {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .pivot-card .row span:last-child {
      color: var(--text);
      font-weight: 600;
    }

    .rsi-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .rsi-ob { background: rgba(239,83,80,0.18); color: var(--red); }
    .rsi-os { background: rgba(38,166,154,0.18); color: var(--green); }
    .rsi-n  { background: rgba(107,114,128,0.15); color: var(--muted); }

    .macd-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .macd-bull { background: rgba(38,166,154,0.18); color: var(--green); }
    .macd-bear { background: rgba(239,83,80,0.18); color: var(--red); }

    .no-data {
      color: var(--muted);
      font-size: 0.82rem;
      text-align: center;
      padding: 20px 0;
    }

    .loader {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11,14,23,0.7);
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
      gap: 14px;
    }
    .loader.show { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader p { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <h1>📊 تحلیل تکنیکال</h1>
  <div class="controls">
    <input id="symbolInput" type="text" value="BTCUSDT" placeholder="مثلاً ETHUSDT" style="width:130px; direction:ltr;" />
    <div class="interval-group">
      <button onclick="setInterval('1h')" id="btn-1h">1H</button>
      <button onclick="setInterval('4h')" id="btn-4h" class="active">4H</button>
      <button onclick="setInterval('1d')" id="btn-1d">1D</button>
    </div>
    <button onclick="loadData()" id="loadBtn">بارگذاری</button>
  </div>
  <span id="status">آماده</span>
</header>

<div class="main">
  <aside class="sidebar">
    <h2>آخرین دره و قله</h2>
    <div id="pivotCards"><p class="no-data">داده‌ای بارگذاری نشده</p></div>
  </aside>

  <div class="charts-col">
    <div class="chart-wrap">
      <div class="chart-label">قیمت</div>
      <div id="chart-price"></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-label">RSI (14)</div>
      <div id="chart-rsi"></div>
    </div>
    <div class="chart-wrap">
      <div class="chart-label">MACD (12,26,9)</div>
      <div id="chart-macd"></div>
    </div>
  </div>
</div>

<div class="loader" id="loader">
  <div class="spinner"></div>
  <p>در حال دریافت داده از بایننس...</p>
</div>

<script>
// ─── State ─────────────────────────────────────────────────────────────────
let currentInterval = '4h';
let priceChart, rsiChart, macdChart;
let priceSeries, rsiSeries, macdLine, macdSignal, macdHist;
let rsiOBLine, rsiOSLine;

// ─── Interval Toggle ────────────────────────────────────────────────────────
function setInterval(iv) {
  currentInterval = iv;
  ['1h','4h','1d'].forEach(i => {
    document.getElementById('btn-' + i).classList.toggle('active', i === iv);
  });
}

// ─── Chart Init ─────────────────────────────────────────────────────────────
function initCharts() {
  const commonOpts = {
    layout: { background: { color: '#0b0e17' }, textColor: '#6b7280' },
    grid: { vertLines: { color: '#1e2535' }, horzLines: { color: '#1e2535' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    timeScale: { borderColor: '#1e2535', timeVisible: true },
    rightPriceScale: { borderColor: '#1e2535' },
    handleScroll: true,
    handleScale: true,
  };

  // Price
  priceChart = LightweightCharts.createChart(
    document.getElementById('chart-price'),
    { ...commonOpts, height: 380 }
  );
  priceSeries = priceChart.addLineSeries({
    color: '#2962ff', lineWidth: 2,
    priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
  });

  // RSI
  rsiChart = LightweightCharts.createChart(
    document.getElementById('chart-rsi'),
    { ...commonOpts, height: 160 }
  );
  rsiSeries = rsiChart.addLineSeries({ color: '#ffc107', lineWidth: 1.5 });
  rsiOBLine = rsiChart.addLineSeries({ color: '#ef5350', lineWidth: 1, lineStyle: 2 });
  rsiOSLine = rsiChart.addLineSeries({ color: '#26a69a', lineWidth: 1, lineStyle: 2 });

  // MACD
  macdChart = LightweightCharts.createChart(
    document.getElementById('chart-macd'),
    { ...commonOpts, height: 160 }
  );
  macdLine   = macdChart.addLineSeries({ color: '#2962ff', lineWidth: 1.5 });
  macdSignal = macdChart.addLineSeries({ color: '#ff6d00', lineWidth: 1.5 });
  macdHist   = macdChart.addHistogramSeries({
    color: '#26a69a',
    priceFormat: { type: 'price', precision: 4 },
  });

  // Sync timescales
  priceChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (range) {
      rsiChart.timeScale().setVisibleLogicalRange(range);
      macdChart.timeScale().setVisibleLogicalRange(range);
    }
  });
}

// ─── Indicators ─────────────────────────────────────────────────────────────
function calcRSI(closes, period = 14) {
  const rsi = [];
  let gains = 0, losses = 0;

  for (let i = 1; i <= period; i++) {
    const diff = closes[i] - closes[i - 1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }

  let avgGain = gains / period;
  let avgLoss = losses / period;
  rsi[period] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);

  for (let i = period + 1; i < closes.length; i++) {
    const diff = closes[i] - closes[i - 1];
    avgGain = (avgGain * (period - 1) + Math.max(diff, 0)) / period;
    avgLoss = (avgLoss * (period - 1) + Math.max(-diff, 0)) / period;
    rsi[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return rsi;
}

function ema(arr, period) {
  const k = 2 / (period + 1);
  const result = new Array(arr.length).fill(null);
  let start = 0;
  while (start < arr.length && arr[start] == null) start++;
  result[start] = arr[start];
  for (let i = start + 1; i < arr.length; i++) {
    result[i] = arr[i] * k + result[i - 1] * (1 - k);
  }
  return result;
}

function calcMACD(closes, fast = 12, slow = 26, signal = 9) {
  const emaFast = ema(closes, fast);
  const emaSlow = ema(closes, slow);
  const macdLine = closes.map((_, i) =>
    emaFast[i] != null && emaSlow[i] != null ? emaFast[i] - emaSlow[i] : null
  );
  const signalLine = ema(macdLine, signal);
  const histogram = macdLine.map((v, i) =>
    v != null && signalLine[i] != null ? v - signalLine[i] : null
  );
  return { macdLine, signalLine, histogram };
}

// ─── Pivot Detection ────────────────────────────────────────────────────────
function findPivots(candles, wing = 2) {
  const peaks = [], valleys = [];
  for (let i = wing; i < candles.length - wing; i++) {
    const c = candles[i];
    let isPeak = true, isValley = true;
    for (let j = i - wing; j <= i + wing; j++) {
      if (j === i) continue;
      if (candles[j].high >= c.high) isPeak = false;
      if (candles[j].low  <= c.low)  isValley = false;
    }
    if (isPeak)   peaks.push(i);
    if (isValley) valleys.push(i);
  }
  return { peaks, valleys };
}

// ─── Load & Render ───────────────────────────────────────────────────────────
async function loadData() {
  const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
  if (!symbol) return;

  document.getElementById('loader').classList.add('show');
  document.getElementById('loadBtn').disabled = true;
  document.getElementById('status').textContent = 'در حال دریافت...';

  try {
    const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${currentInterval}&limit=300`);

    if (!res.ok) throw new Error(`خطای بایننس: ${res.status}`);

    const raw = await res.json();
    const candles = raw.map(k => ({
      time:   Math.floor(k[0] / 1000),
      open:   parseFloat(k[1]),
      high:   parseFloat(k[2]),
      low:    parseFloat(k[3]),
      close:  parseFloat(k[4]),
      volume: parseFloat(k[5]),
    }));
    const closes  = candles.map(c => c.close);
    const times   = candles.map(c => c.time);

    // RSI
    const rsiArr = calcRSI(closes);

    // MACD
    const { macdLine: ml, signalLine: sl, histogram: hist } = calcMACD(closes);

    // Pivots
    const { peaks, valleys } = findPivots(candles);

    // ── Price chart ──
    priceSeries.setData(candles.map(c => ({ time: c.time, value: c.close })));

    // Pivot markers on price
    const markers = [];
    if (peaks.length) {
      const i = peaks[peaks.length - 1];
      markers.push({ time: times[i], position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: 'قله' });
    }
    if (valleys.length) {
      const i = valleys[valleys.length - 1];
      markers.push({ time: times[i], position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: 'دره' });
    }
    markers.sort((a, b) => a.time - b.time);
    priceSeries.setMarkers(markers);

    // ── RSI chart ──
    rsiSeries.setData(
      times.map((t, i) => rsiArr[i] != null ? { time: t, value: rsiArr[i] } : null).filter(Boolean)
    );
    const rsiTimeRange = times.filter((_, i) => rsiArr[i] != null);
    rsiOBLine.setData(rsiTimeRange.map(t => ({ time: t, value: 70 })));
    rsiOSLine.setData(rsiTimeRange.map(t => ({ time: t, value: 30 })));

    // ── MACD chart ──
    macdLine.setData(
      times.map((t, i) => ml[i] != null ? { time: t, value: ml[i] } : null).filter(Boolean)
    );
    macdSignal.setData(
      times.map((t, i) => sl[i] != null ? { time: t, value: sl[i] } : null).filter(Boolean)
    );
    macdHist.setData(
      times.map((t, i) => hist[i] != null
        ? { time: t, value: hist[i], color: hist[i] >= 0 ? '#26a69a' : '#ef5350' }
        : null
      ).filter(Boolean)
    );

    // ── Sidebar ──
    renderSidebar({ candles, rsiArr, macdLine: ml, signalLine: sl, peaks, valleys });

    // Fit
    priceChart.timeScale().fitContent();
    rsiChart.timeScale().fitContent();
    macdChart.timeScale().fitContent();

    document.getElementById('status').textContent = `${symbol} · ${currentInterval} · ${candles.length} کندل`;
  } catch (e) {
    document.getElementById('status').textContent = '❌ ' + e.message;
  } finally {
    document.getElementById('loader').classList.remove('show');
    document.getElementById('loadBtn').disabled = false;
  }
}

function renderSidebar({ candles, rsiArr, macdLine, signalLine, peaks, valleys }) {
  const fmt = v => v?.toLocaleString('en-US', { maximumFractionDigits: 4 }) ?? '—';
  const fmtDate = t => new Date(t * 1000).toLocaleDateString('fa-IR');

  function rsiClass(v) {
    if (v == null) return '';
    if (v >= 70) return 'rsi-ob';
    if (v <= 30) return 'rsi-os';
    return 'rsi-n';
  }
  function rsiLabel(v) {
    if (v == null) return '—';
    if (v >= 70) return 'اشباع خرید';
    if (v <= 30) return 'اشباع فروش';
    return 'خنثی';
  }
  function macdClass(i) {
    if (macdLine[i] == null || signalLine[i] == null) return '';
    return macdLine[i] > signalLine[i] ? 'macd-bull' : 'macd-bear';
  }
  function macdLabel(i) {
    if (macdLine[i] == null || signalLine[i] == null) return '—';
    return macdLine[i] > signalLine[i] ? 'صعودی' : 'نزولی';
  }

  let html = '';

  if (peaks.length) {
    const i = peaks[peaks.length - 1];
    const c = candles[i];
    const rv = rsiArr[i];
    html += `
    <div class="pivot-card peak">
      <div class="type">▼ آخرین قله</div>
      <div class="price-val">$${fmt(c.high)}</div>
      <div class="row"><span>تاریخ</span><span>${fmtDate(c.time)}</span></div>
      <div class="row"><span>قیمت بسته</span><span>$${fmt(c.close)}</span></div>
      <div class="row">
        <span>RSI</span>
        <span>
          ${rv != null ? rv.toFixed(2) : '—'}
          <span class="rsi-badge ${rsiClass(rv)}">${rsiLabel(rv)}</span>
        </span>
      </div>
      <div class="row">
        <span>MACD</span>
        <span>
          ${macdLine[i] != null ? macdLine[i].toFixed(4) : '—'}
          <span class="macd-badge ${macdClass(i)}">${macdLabel(i)}</span>
        </span>
      </div>
    </div>`;
  }

  if (valleys.length) {
    const i = valleys[valleys.length - 1];
    const c = candles[i];
    const rv = rsiArr[i];
    html += `
    <div class="pivot-card valley">
      <div class="type">▲ آخرین دره</div>
      <div class="price-val">$${fmt(c.low)}</div>
      <div class="row"><span>تاریخ</span><span>${fmtDate(c.time)}</span></div>
      <div class="row"><span>قیمت بسته</span><span>$${fmt(c.close)}</span></div>
      <div class="row">
        <span>RSI</span>
        <span>
          ${rv != null ? rv.toFixed(2) : '—'}
          <span class="rsi-badge ${rsiClass(rv)}">${rsiLabel(rv)}</span>
        </span>
      </div>
      <div class="row">
        <span>MACD</span>
        <span>
          ${macdLine[i] != null ? macdLine[i].toFixed(4) : '—'}
          <span class="macd-badge ${macdClass(i)}">${macdLabel(i)}</span>
        </span>
      </div>
    </div>`;
  }

  document.getElementById('pivotCards').innerHTML = html || '<p class="no-data">Pivot پیدا نشد</p>';
}

// ─── Init ───────────────────────────────────────────────────────────────────
initCharts();
</script>
</body>
</html>

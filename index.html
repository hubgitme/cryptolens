<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحلیل تکنیکال ارز دیجیتال</title>
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg:      #0b0e17;
      --surface: #131722;
      --border:  #1e2535;
      --accent:  #2962ff;
      --green:   #26a69a;
      --red:     #ef5350;
      --yellow:  #ffc107;
      --text:    #d1d4dc;
      --muted:   #6b7280;
      --radius:  10px;
      --font:    'Segoe UI', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    header h1 { font-size: 1rem; font-weight: 700; color: #fff; flex-shrink: 0; }

    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    input, button, select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.83rem;
      font-family: var(--font);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    button, select { cursor: pointer; }
    button { transition: opacity 0.2s; }
    button:hover { opacity: 0.8; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .iv-group { display: flex; }
    .iv-group button {
      border-radius: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 13px;
    }
    .iv-group button:first-child { border-radius: 6px 0 0 6px; }
    .iv-group button:last-child  { border-radius: 0 6px 6px 0; }
    .iv-group button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    #loadBtn { background: var(--accent); color: #fff; border: none; font-weight: 600; padding: 6px 16px; }

    #status { margin-right: auto; font-size: 0.78rem; color: var(--muted); }

    /* ── Pane Legend — روی خود چارت، بالا-چپ هر پنل (سبک TradingView) ── */
    .pane-legend {
      position: absolute;
      top: 6px; left: 10px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      direction: ltr;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .lg-symbol { color: #fff; font-weight: 700; letter-spacing: 0.3px; }
    .lg-item   { color: var(--muted); display: flex; gap: 3px; align-items: baseline; }
    .lg-val    { color: var(--text); font-weight: 600; }
    .lg-val.up { color: var(--green); }
    .lg-val.dn { color: var(--red); }

    /* ── Layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    /* Signal card */
    .signal-card {
      border-radius: var(--radius);
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.78rem;
      border: 1px solid var(--border);
    }
    .signal-card.bearish { background: rgba(239,83,80,0.07);  border-color: rgba(239,83,80,0.4); }
    .signal-card.bullish { background: rgba(38,166,154,0.07); border-color: rgba(38,166,154,0.4); }
    .signal-card.neutral { background: var(--bg); color: var(--muted); text-align: center; padding: 12px; }

    /* نوار وضعیت فشرده (واگرایی خنثی + RSI فعلی)، کنار هم توی pivot-row */
    .status-bar {
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.66rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-bar.neutral { color: var(--muted); }
    .status-bar.rsi-ob { background: rgba(239,83,80,0.12); border-color: rgba(239,83,80,0.4); color: var(--red); }
    .status-bar.rsi-os { background: rgba(38,166,154,0.12); border-color: rgba(38,166,154,0.4); color: var(--green); }
    .status-bar.rsi-n  { color: var(--muted); }
    .status-bar.bearish { background: rgba(239,83,80,0.1);  border-color: rgba(239,83,80,0.4);  color: var(--red); }
    .status-bar.bullish { background: rgba(38,166,154,0.1); border-color: rgba(38,166,154,0.4); color: var(--green); }
    .sidebar.mobile-grid .pivot-row .status-bar { flex: 1 1 0; min-width: 0; box-sizing: border-box; }
    .signal-title { font-weight: 700; font-size: 0.82rem; color: #fff; }
    .signal-desc  { color: var(--muted); font-size: 0.72rem; margin-bottom: 3px; }
    .signal-row   { display: flex; gap: 6px; color: var(--muted); }
    .signal-row span:first-child { flex-shrink: 0; }
    .signal-row span:last-child { color: var(--text); font-weight: 600; }
    em.up { color: var(--green); font-style: normal; }
    em.dn { color: var(--red);   font-style: normal; }

    /* Pivot card */
    .pivot-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 13px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.78rem;
    }
    .pivot-card .ptype { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .pivot-card.peak   .ptype { color: var(--red); }
    .pivot-card.valley .ptype { color: var(--green); }
    .pivot-card .price-val { font-size: 1.1rem; font-weight: 700; color: #fff; direction: ltr; }
    .pivot-card .row { display: flex; gap: 6px; color: var(--muted); }
    .pivot-card .row span:first-child { flex-shrink: 0; }
    .pivot-card .row span:last-child { color: var(--text); font-weight: 600; }

    .badge {
      display: inline-block; padding: 1px 6px; border-radius: 4px;
      font-size: 0.7rem; font-weight: 700;
    }
    .rsi-ob { background: rgba(239,83,80,0.18);  color: var(--red); }
    .rsi-os { background: rgba(38,166,154,0.18); color: var(--green); }
    .rsi-n  { background: rgba(107,114,128,0.15); color: var(--muted); }
    .macd-bull { background: rgba(38,166,154,0.18); color: var(--green); }
    .macd-bear { background: rgba(239,83,80,0.18);  color: var(--red); }

    .no-data { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 16px 0; }

    /* ── این کلاس با JS (نه CSS media query) کنترل میشه، پس مستقل از رفتار مرورگره ── */
    /* ستون‌بندی صریح: هر ردیف (قله+دره) توی یه div جدا با ۲ بچه — مطمئن‌تر از flex-wrap کل سایدبار */
    .sidebar.mobile-grid {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px;
      overflow-y: auto;
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      border-right: none;
      border-top: 1px solid var(--border);
    }
    .sidebar.mobile-grid h2 { font-size: 0.62rem; padding-bottom: 4px; }

    /* ردیف جفتی قله|دره — فقط تو حالت موبایل فعاله */
    .sidebar.mobile-grid .pivot-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .sidebar.mobile-grid .pivot-row .pivot-card {
      flex: 1 1 0;
      min-width: 0;
      box-sizing: border-box;
    }

    .sidebar.mobile-grid .signal-card,
    .sidebar.mobile-grid .pivot-card {
      padding: 7px 9px;
      font-size: 0.66rem;
      gap: 3px;
      box-sizing: border-box;
    }
    .sidebar.mobile-grid .signal-title { font-size: 0.7rem; }
    .sidebar.mobile-grid .signal-desc  { font-size: 0.6rem; }
    .sidebar.mobile-grid .price-val    { font-size: 0.88rem !important; }
    .sidebar.mobile-grid .ptype        { font-size: 0.58rem !important; }
    .sidebar.mobile-grid .badge        { font-size: 0.58rem; padding: 0 4px; }

    /* ── Charts column ── */
    .charts-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      overflow: hidden;
    }

    .chart-wrap {
      position: relative;
      border-bottom: 1px solid var(--border);
    }
    .chart-wrap:last-child { border-bottom: none; }

    /* ── Loader ── */
    .loader {
      display: none;
      position: fixed; inset: 0;
      background: rgba(11,14,23,0.75);
      align-items: center; justify-content: center;
      z-index: 999; flex-direction: column; gap: 14px;
    }
    .loader.show { display: flex; }
    .spinner {
      width: 34px; height: 34px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader p { color: var(--muted); font-size: 0.83rem; }

    /* ══════════════════════════════════════════════════════════
       موبایل
       ══════════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      header {
        padding: 5px 10px;
        gap: 6px;
        min-height: auto;
      }
      header h1 { font-size: 0.78rem; }

      .controls {
        width: 100%;
        justify-content: flex-start;
        gap: 5px;
      }
      #symbolInput {
        flex: 1 1 80px;
        min-width: 0;
        font-size: 16px;
        padding: 5px 8px;
      }
      #zigzagInput { font-size: 16px; width: 42px; padding: 5px 4px; }
      label[for], .controls label { font-size: 0.68rem; }

      .iv-group button, #loadBtn {
        padding: 5px 9px;
        font-size: 0.72rem;
      }

      #status {
        width: 100%;
        order: 10;
        font-size: 0.62rem;
      }

      /* Legend روی چارت، فشرده‌تر تو موبایل */
      .pane-legend {
        font-size: 0.6rem;
        gap: 6px;
        top: 4px; left: 6px;
      }

      /* توجه: چیدمان اصلی (main/charts-col/sidebar) الان توسط JS (applyLayout) کنترل میشه، نه اینجا */
    }

    @media (max-width: 420px) {
      header h1 { display: none; }
      .iv-group button, #loadBtn { padding: 5px 7px; font-size: 0.68rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>📊 تحلیل تکنیکال</h1>
  <div class="controls">
    <input id="symbolInput" type="text" value="BTCUSDT" style="width:100px; direction:ltr;" />
    <select id="symbolSelect" onchange="onSymbolSelect(this)" style="direction:ltr; max-width:150px;">
      <option value="">— انتخاب سریع —</option>
      <optgroup label="۱۰ ارز برتر" id="topCoinsGroup"></optgroup>
      <optgroup label="ذخیره‌شده‌های من" id="savedCoinsGroup"></optgroup>
    </select>
    <button id="saveSymbolBtn" onclick="saveCurrentSymbol()" title="ذخیره ارز فعلی">⭐ ذخیره</button>
    <div class="iv-group">
      <button onclick="setIv('1h')"  id="btn-1h">1H</button>
      <button onclick="setIv('4h')"  id="btn-4h" class="active">4H</button>
      <button onclick="setIv('1d')"  id="btn-1d">1D</button>
    </div>
    <div style="display:flex; align-items:center; gap:5px;">
      <label style="font-size:0.78rem; color:var(--muted);">حساسیت%</label>
      <input id="zigzagInput" type="number" value="0.5" step="0.1" min="0.1" max="5" style="width:55px; direction:ltr;" onchange="zigzagPct = parseFloat(this.value) || 0.5" />
    </div>
    <button id="loadBtn" onclick="loadData()">بارگذاری</button>
  </div>
  <span id="status">آماده</span>
</header>

<div class="main">
  <aside class="sidebar">
    <h2>سیگنال واگرایی</h2>
    <div id="pivotCards"><p class="no-data">داده‌ای بارگذاری نشده</p></div>
  </aside>

  <div class="charts-col" id="chartsCol">
    <div class="chart-wrap" id="wrap-price">
      <div class="pane-legend" id="legend-price">
        <span class="lg-symbol" id="lg-symbol">BTCUSDT · 4H</span>
        <span class="lg-item">O<b id="lg-open" class="lg-val">—</b></span>
        <span class="lg-item">H<b id="lg-high" class="lg-val">—</b></span>
        <span class="lg-item">L<b id="lg-low"  class="lg-val">—</b></span>
        <span class="lg-item">C<b id="lg-close" class="lg-val">—</b></span>
      </div>
      <div id="chart-price"></div>
    </div>
    <div class="chart-wrap" id="wrap-rsi">
      <div class="pane-legend" id="legend-rsi">
        <span class="lg-symbol">RSI (14)</span>
        <b id="lg-rsi" class="lg-val">—</b>
      </div>
      <div id="chart-rsi"></div>
    </div>
    <div class="chart-wrap" id="wrap-macd">
      <div class="pane-legend" id="legend-macd">
        <span class="lg-symbol">MACD (12,26,9)</span>
        <span class="lg-item" style="color:#2962ff">MACD <b id="lg-macd" class="lg-val">—</b></span>
        <span class="lg-item" style="color:#ff6d00">Signal <b id="lg-signal" class="lg-val">—</b></span>
        <span class="lg-item">Hist <b id="lg-hist" class="lg-val">—</b></span>
      </div>
      <div id="chart-macd"></div>
    </div>
  </div>
</div>

<div class="loader" id="loader">

  <div class="spinner"></div>
  <p>در حال دریافت داده از بایننس...</p>
</div>

<script>
// ─── Globals ────────────────────────────────────────────────────────────────
let currentIv = '4h';

// ─── لیست ارزها (۱۰ ارز برتر + ذخیره‌شده‌های کاربر با localStorage) ──────────
const TOP_COINS = ['BTCUSDT','ETHUSDT','NEARUSDT','SOLUSDT','XRPUSDT','ADAUSDT','CRVUSDT','XLMUSDT','DOGEUSDT','TRXUSDT','TONUSDT','PEPEUSDT'];

function getSavedSymbols() {
  try { return JSON.parse(localStorage.getItem('savedSymbols') || '[]'); }
  catch(e) { return []; }
}

function setSavedSymbols(arr) {
  try { localStorage.setItem('savedSymbols', JSON.stringify(arr)); } catch(e) {}
}

function populateSymbolDropdown() {
  const topGroup   = document.getElementById('topCoinsGroup');
  const savedGroup = document.getElementById('savedCoinsGroup');

  topGroup.innerHTML = TOP_COINS.map(s => `<option value="${s}">${s}</option>`).join('');

  const saved = getSavedSymbols();
  savedGroup.innerHTML = saved.length
    ? saved.map(s => `<option value="${s}">${s} ⭐</option>`).join('')
    : '';
  savedGroup.style.display = saved.length ? '' : 'none';
}

function onSymbolSelect(sel) {
  if (!sel.value) return;
  document.getElementById('symbolInput').value = sel.value;
  sel.value = ''; // برگردون به حالت پیش‌فرض تا دوباره قابل انتخاب باشه
  loadData();
}

function saveCurrentSymbol() {
  const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
  if (!symbol) return;
  const saved = getSavedSymbols();
  if (!saved.includes(symbol)) {
    saved.push(symbol);
    setSavedSymbols(saved);
    populateSymbolDropdown();
  }
  document.getElementById('status').textContent = `✅ ${symbol} ذخیره شد`;
}

let zigzagPct = 0.5; // درصد حساسیت تشخیص دره/قله
let priceChart, rsiChart, macdChart;
let candleSeries, rsiSeries, rsiOB, rsiOS, macdLineSeries, macdSignalSeries, macdHistSeries;
let globalCandles = [], globalRsi = [], globalMacdL = [], globalMacdS = [], globalMacdH = [];
let lastPricePrecision = 2;
let isSyncing = false;

// ─── Interval ───────────────────────────────────────────────────────────────
function setIv(iv) {
  currentIv = iv;
  ['1h','4h','1d'].forEach(i =>
    document.getElementById('btn-' + i).classList.toggle('active', i === iv)
  );
}

// ─── چیدمان موبایل — مستقل از CSS media query، مستقیم با JS اعمال میشه ──────
// (بعضی مرورگرها/وب‌ویوها عرض واقعی صفحه رو درست به CSS گزارش نمی‌دن)
function applyResponsiveLayout() {
  const isMobile = window.innerWidth <= 768;
  const main      = document.querySelector('.main');
  const chartsCol = document.getElementById('chartsCol');
  const sidebar   = document.querySelector('.sidebar');

  if (isMobile) {
    main.style.flexDirection = 'column';
    main.style.overflow = 'hidden';

    chartsCol.style.order  = '1';
    chartsCol.style.flex   = '0 0 62vh';
    chartsCol.style.height = '62vh';
    chartsCol.style.overflow = 'hidden';

    sidebar.style.order = '2';
    sidebar.classList.add('mobile-grid');
  } else {
    main.style.flexDirection = '';
    main.style.overflow = '';

    chartsCol.style.order  = '';
    chartsCol.style.flex   = '';
    chartsCol.style.height = '';
    chartsCol.style.overflow = '';

    sidebar.style.order = '';
    sidebar.classList.remove('mobile-grid');
  }
}

// ─── Chart heights ──────────────────────────────────────────────────────────
function calcHeights() {
  const col = document.getElementById('chartsCol');
  const total = col.clientHeight;
  // حداقل ارتفاع تا اندیکاتورها خیلی فشرده نشن
  const minTotal = Math.max(total, 420);
  return {
    price: Math.floor(minTotal * 0.40),
    rsi:   Math.floor(minTotal * 0.34),
    macd:  Math.floor(minTotal * 0.26),
  };
}

// ─── Resize — چارت‌ها رو موقع چرخش/تغییر سایز صفحه دوباره اندازه می‌کنه ──
function resizeChartsNow() {
  applyResponsiveLayout();
  if (!priceChart) return;
  const h = calcHeights();

  const priceEl = document.getElementById('chart-price');
  const rsiEl   = document.getElementById('chart-rsi');
  const macdEl  = document.getElementById('chart-macd');

  priceEl.style.height = h.price + 'px';
  rsiEl.style.height   = h.rsi + 'px';
  macdEl.style.height  = h.macd + 'px';

  priceChart.resize(priceEl.clientWidth, h.price);
  rsiChart.resize(rsiEl.clientWidth, h.rsi);
  macdChart.resize(macdEl.clientWidth, h.macd);
}

let resizeTimer = null;
function handleResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeChartsNow, 150);
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', handleResize);

// ─── Init Charts ────────────────────────────────────────────────────────────
function initCharts() {
  const h = calcHeights();

  const base = {
    layout: { background: { color: '#0b0e17' }, textColor: '#6b7280' },
    grid: { vertLines: { color: '#1e2535' }, horzLines: { color: '#1e2535' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Magnet },
    timeScale: { borderColor: '#1e2535', timeVisible: true, rightOffset: 5, barSpacing: 9 },
    rightPriceScale: { borderColor: '#1e2535' },
    handleScroll: true,
    handleScale: true,
  };

  // Price (candlestick)
  document.getElementById('chart-price').style.height = h.price + 'px';
  priceChart = LightweightCharts.createChart(document.getElementById('chart-price'), { ...base, height: h.price });
  candleSeries = priceChart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    priceFormat: { type: 'price', precision: 2, minMove: 0.01 }, // ← تعداد رقم اعشار قیمت اینجا
  });

  // RSI
  document.getElementById('chart-rsi').style.height = h.rsi + 'px';
  rsiChart = LightweightCharts.createChart(document.getElementById('chart-rsi'), { ...base, height: h.rsi });
  rsiSeries = rsiChart.addLineSeries({ color: '#ffc107', lineWidth: 1.5 });
  rsiOB = rsiChart.addLineSeries({ color: '#ef5350', lineWidth: 1, lineStyle: 2 });
  rsiOS = rsiChart.addLineSeries({ color: '#26a69a', lineWidth: 1, lineStyle: 2 });

  // MACD
  document.getElementById('chart-macd').style.height = h.macd + 'px';
  macdChart = LightweightCharts.createChart(document.getElementById('chart-macd'), { ...base, height: h.macd });
  macdLineSeries   = macdChart.addLineSeries({ color: '#2962ff', lineWidth: 1.5 });
  macdSignalSeries = macdChart.addLineSeries({ color: '#ff6d00', lineWidth: 1.5 });
  macdHistSeries   = macdChart.addHistogramSeries({ priceFormat: { type: 'price', precision: 4 } });

  // ── Sync timescales (robust) ──
  const allCharts = [priceChart, rsiChart, macdChart];

  allCharts.forEach(src => {
    src.timeScale().subscribeVisibleLogicalRangeChange(range => {
      if (isSyncing || !range) return;
      isSyncing = true;
      allCharts.forEach(t => {
        if (t !== src) {
          try { t.timeScale().setVisibleLogicalRange(range); } catch(e) {}
        }
      });
      isSyncing = false;
    });
  });

  // ── Crosshair sync + tooltip ──
  function syncCrosshair(src, targets, getTooltip) {
    src.subscribeCrosshairMove(param => {
      // Sync crosshair to other charts
      if (param.time) {
        targets.forEach(t => {
          t.setCrosshairPosition(
            param.seriesData?.values()?.next()?.value?.value ?? 0,
            param.time,
            t.series?.[0]
          );
        });
      } else {
        targets.forEach(t => t.clearCrosshairPosition());
      }
      // Update tooltip bar
      if (param.time && getTooltip) getTooltip(param);
    });
  }

  // crosshair on price chart drives legend
  priceChart.subscribeCrosshairMove(param => {
    if (!param.time) { showLastLegend(); return; }
    const idx = globalCandles.findIndex(c => c.time === param.time);
    if (idx === -1) return;
    updateLegendByIndex(idx);

    // sync crosshair position on rsi and macd charts
    if (!isSyncing) {
      isSyncing = true;
      const rsi = globalRsi[idx], ml = globalMacdL[idx];
      if (rsi != null) { try { rsiChart.setCrosshairPosition(rsi, param.time, rsiSeries); } catch(e){} }
      if (ml  != null) { try { macdChart.setCrosshairPosition(ml, param.time, macdLineSeries); } catch(e){} }
      isSyncing = false;
    }
  });

  rsiChart.subscribeCrosshairMove(param => {
    if (!param.time) { if (!isSyncing) showLastLegend(); return; }
    if (isSyncing) return;
    isSyncing = true;
    try { priceChart.setCrosshairPosition(0, param.time, candleSeries); } catch(e){}
    try { macdChart.setCrosshairPosition(0, param.time, macdLineSeries); } catch(e){}
    isSyncing = false;
    const idx = globalCandles.findIndex(c => c.time === param.time);
    if (idx !== -1) updateLegendByIndex(idx);
  });

  macdChart.subscribeCrosshairMove(param => {
    if (!param.time) { if (!isSyncing) showLastLegend(); return; }
    if (isSyncing) return;
    isSyncing = true;
    try { priceChart.setCrosshairPosition(0, param.time, candleSeries); } catch(e){}
    try { rsiChart.setCrosshairPosition(0, param.time, rsiSeries); } catch(e){}
    isSyncing = false;
    const idx = globalCandles.findIndex(c => c.time === param.time);
    if (idx !== -1) updateLegendByIndex(idx);
  });
}

// ─── Pane Legends (سبک TradingView — بالا-چپ هر پنل، همیشه یه مقدار نشون میده) ──
function updateLegendByIndex(idx) {
  const c   = globalCandles[idx];
  const rsi = globalRsi[idx];
  const ml  = globalMacdL[idx];
  const sl  = globalMacdS[idx];
  const hl  = globalMacdH[idx];
  if (!c) return;

  const fmt  = v => v != null ? v.toFixed(2) : '—';
  const fmtP = v => v != null ? v.toLocaleString('en-US', { maximumFractionDigits: lastPricePrecision }) : '—';

  document.getElementById('lg-open').textContent  = fmtP(c.open);
  document.getElementById('lg-high').textContent  = fmtP(c.high);
  document.getElementById('lg-low').textContent   = fmtP(c.low);
  const closeEl = document.getElementById('lg-close');
  closeEl.textContent = fmtP(c.close);
  closeEl.className = 'lg-val ' + (c.close >= c.open ? 'up' : 'dn');

  const rsiEl = document.getElementById('lg-rsi');
  rsiEl.textContent = fmt(rsi);
  rsiEl.className = 'lg-val' + (rsi >= 70 ? ' dn' : rsi <= 30 ? ' up' : '');

  document.getElementById('lg-macd').textContent   = fmt(ml);
  document.getElementById('lg-signal').textContent = fmt(sl);
  const histEl = document.getElementById('lg-hist');
  histEl.textContent = fmt(hl);
  histEl.className = 'lg-val ' + (hl >= 0 ? 'up' : 'dn');
}

function showLastLegend() {
  if (globalCandles.length) updateLegendByIndex(globalCandles.length - 1);
}

// ─── Indicators ──────────────────────────────────────────────────────────────
function calcRSI(closes, period = 14) {
  const rsi = new Array(closes.length).fill(null);
  let g = 0, l = 0;
  for (let i = 1; i <= period; i++) {
    const d = closes[i] - closes[i-1];
    d >= 0 ? g += d : l -= d;
  }
  let ag = g / period, al = l / period;
  rsi[period] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  for (let i = period + 1; i < closes.length; i++) {
    const d = closes[i] - closes[i-1];
    ag = (ag * (period-1) + Math.max(d, 0)) / period;
    al = (al * (period-1) + Math.max(-d, 0)) / period;
    rsi[i] = al === 0 ? 100 : 100 - 100 / (1 + ag / al);
  }
  return rsi;
}

function ema(arr, p) {
  const k = 2 / (p + 1), out = new Array(arr.length).fill(null);
  let s = 0; while (s < arr.length && arr[s] == null) s++;
  out[s] = arr[s];
  for (let i = s+1; i < arr.length; i++)
    out[i] = arr[i] != null ? arr[i] * k + out[i-1] * (1-k) : null;
  return out;
}

function calcMACD(closes, fast=12, slow=26, sig=9) {
  const ef = ema(closes, fast), es = ema(closes, slow);
  const ml = closes.map((_,i) => ef[i]!=null && es[i]!=null ? ef[i]-es[i] : null);
  const sl = ema(ml, sig);
  const hl = ml.map((v,i) => v!=null && sl[i]!=null ? v-sl[i] : null);
  return { ml, sl, hl };
}

// ─── ZigZag Pivots (بر اساس قیمت بسته شدن، نه سایه کندل) ─────────────────────
function calcZigZag(candles, deviationPct = 0.5) {
  const pivots = [];
  if (candles.length < 2) return pivots;

  let direction = 0; // 0=unknown, 1=up-tracking(looking for high), -1=down-tracking
  let anchorIdx = 0;
  let anchorPrice = candles[0].close;

  for (let i = 1; i < candles.length; i++) {
    const cp = candles[i].close;

    if (direction === 0) {
      const upPct   = (cp - anchorPrice) / anchorPrice * 100;
      const downPct = (anchorPrice - cp) / anchorPrice * 100;
      if (upPct >= deviationPct) {
        pivots.push({ idx: 0, type: 'low', price: candles[0].close });
        direction = 1; anchorPrice = cp; anchorIdx = i;
      } else if (downPct >= deviationPct) {
        pivots.push({ idx: 0, type: 'high', price: candles[0].close });
        direction = -1; anchorPrice = cp; anchorIdx = i;
      }
      continue;
    }

    if (direction === 1) {
      if (cp >= anchorPrice) { anchorPrice = cp; anchorIdx = i; }
      const retrace = (anchorPrice - cp) / anchorPrice * 100;
      if (retrace >= deviationPct) {
        pivots.push({ idx: anchorIdx, type: 'high', price: anchorPrice });
        direction = -1; anchorPrice = cp; anchorIdx = i;
      }
    } else {
      if (cp <= anchorPrice) { anchorPrice = cp; anchorIdx = i; }
      const retrace = (cp - anchorPrice) / anchorPrice * 100;
      if (retrace >= deviationPct) {
        pivots.push({ idx: anchorIdx, type: 'low', price: anchorPrice });
        direction = 1; anchorPrice = cp; anchorIdx = i;
      }
    }
  }

  const peaks   = pivots.filter(p => p.type === 'high').map(p => p.idx);
  const valleys = pivots.filter(p => p.type === 'low').map(p => p.idx);
  return { peaks, valleys };
}

// ─── RSI Local Extrema (finds peaks/valleys directly ON the RSI curve) ───────
function findRsiExtrema(rsiArr, wing = 1) {
  const highs = [], lows = [];
  for (let i = wing; i < rsiArr.length - wing; i++) {
    if (rsiArr[i] == null) continue;
    let isHigh = true, isLow = true;
    for (let j = i - wing; j <= i + wing; j++) {
      if (j === i || rsiArr[j] == null) continue;
      if (rsiArr[j] >= rsiArr[i]) isHigh = false;
      if (rsiArr[j] <= rsiArr[i]) isLow  = false;
    }
    if (isHigh) highs.push(i);
    if (isLow)  lows.push(i);
  }
  return { highs, lows };
}

// ─── Divergence — پیوت‌ها از روی خود RSI پیدا میشن، قیمت (close) در همون نقاط مقایسه میشه ─
function detectDivergence({ candles, rsiArr }, lookback = 6, wing = 1) {
  const result = { bearish: null, bullish: null, allBearish: [], allBullish: [], rsiHighs: [], rsiLows: [] };

  const { highs, lows } = findRsiExtrema(rsiArr, wing);
  result.rsiHighs = highs;
  result.rsiLows  = lows;

  const recentHighs = highs.slice(-lookback);
  const recentLows  = lows.slice(-lookback);

  // Bearish: RSI قله پایین‌تر ولی قیمت (close) پایین‌تر نرفته (مساوی یا بالاتر)
  for (let k = 1; k < recentHighs.length; k++) {
    const prev = recentHighs[k-1], curr = recentHighs[k];
    const rp = rsiArr[prev], rc = rsiArr[curr];
    const pp = candles[prev].close, pc = candles[curr].close;
    if (rc < rp && pc >= pp * 0.999) {
      result.allBearish.push({
        prevIdx: prev, currentIdx: curr,
        prevPrice: pp, currentPrice: pc,
        prevRsi: rp, currentRsi: rc,
        priceDiff: ((pc - pp) / pp * 100).toFixed(2),
        rsiDiff: (rc - rp).toFixed(2),
      });
    }
  }

  // Bullish: RSI دره بالاتر ولی قیمت (close) بالاتر نرفته (مساوی یا پایین‌تر)
  for (let k = 1; k < recentLows.length; k++) {
    const prev = recentLows[k-1], curr = recentLows[k];
    const rp = rsiArr[prev], rc = rsiArr[curr];
    const pp = candles[prev].close, pc = candles[curr].close;
    if (rc > rp && pc <= pp * 1.001) {
      result.allBullish.push({
        prevIdx: prev, currentIdx: curr,
        prevPrice: pp, currentPrice: pc,
        prevRsi: rp, currentRsi: rc,
        priceDiff: ((pc - pp) / pp * 100).toFixed(2),
        rsiDiff: (rc - rp).toFixed(2),
      });
    }
  }

  result.bearish = result.allBearish.length ? result.allBearish[result.allBearish.length - 1] : null;
  result.bullish = result.allBullish.length ? result.allBullish[result.allBullish.length - 1] : null;

  return result;
}

// ─── Load ────────────────────────────────────────────────────────────────────
async function loadData() {
  const symbol = document.getElementById('symbolInput').value.trim().toUpperCase();
  if (!symbol) return;

  // موبایل: کیبورد رو ببند و اندازه چارت‌ها رو دوباره حساب کن، چون کیبورد ارتفاع صفحه رو موقتاً عوض می‌کنه
  document.activeElement && document.activeElement.blur();

  document.getElementById('loader').classList.add('show');
  document.getElementById('loadBtn').disabled = true;
  document.getElementById('status').textContent = 'در حال دریافت...';

  try {
    const res = await fetch(`/api/klines?symbol=${symbol}&interval=${currentIv}&limit=300`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'خطا در دریافت داده');

    const candles = json.data;

    const closes = candles.map(c => c.close);
    const times  = candles.map(c => c.time);
    const rsiArr = calcRSI(closes);
    const { ml, sl, hl } = calcMACD(closes);

    // Store globally for tooltip
    globalCandles = candles;
    globalRsi  = rsiArr;
    globalMacdL = ml;
    globalMacdS = sl;
    globalMacdH = hl;

    const { peaks, valleys } = calcZigZag(candles, zigzagPct);

    // ── تعداد رقم اعشار بر اساس قیمت: زیر ۱ دلار → ۴ رقم، بالاتر → ۲ رقم ──
    const lastPrice = closes[closes.length - 1];
    const isSmallPrice = lastPrice < 1;
    lastPricePrecision = isSmallPrice ? 4 : 2;
    candleSeries.applyOptions({
      priceFormat: {
        type: 'price',
        precision: lastPricePrecision,
        minMove:   isSmallPrice ? 0.0001 : 0.01,
      }
    });

    // ── Candlestick ──
    candleSeries.setData(candles);

    // رفع باگ مهم: بعد از تغییر ارز، محور قیمت گاهی رنج قیمت قبلی رو نگه می‌داشت
    // (مثلاً از ارزی با قیمت ۰.۲ به ارزی با قیمت ۰.۰۷ سوییچ می‌کردی، کندل‌ها بیرون از دید می‌رفتن)
    priceChart.priceScale('right').applyOptions({ autoScale: true });

    // Markers
    const markers = [];
    peaks.slice(-3).forEach((i, idx, arr) => {
      const label = idx === arr.length - 1 ? 'قله' : `قله-${arr.length - idx}`;
      markers.push({ time: times[i], position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: label });
    });
    valleys.slice(-3).forEach((i, idx, arr) => {
      const label = idx === arr.length - 1 ? 'دره' : `دره-${arr.length - idx}`;
      markers.push({ time: times[i], position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: label });
    });

    const divergence = detectDivergence({ candles, rsiArr });

    // همه واگرایی‌های اخیر رو روی چارت علامت بزن، نه فقط آخری
    divergence.allBearish.forEach(d =>
      markers.push({ time: times[d.currentIdx], position: 'aboveBar', color: '#ff1744', shape: 'arrowDown', text: '⚠ نزولی' })
    );
    divergence.allBullish.forEach(d =>
      markers.push({ time: times[d.currentIdx], position: 'belowBar', color: '#00e676', shape: 'arrowUp', text: '⚠ صعودی' })
    );
    markers.sort((a,b) => a.time - b.time);
    candleSeries.setMarkers(markers);

    // ── RSI ──
    // همه بازه رو پوشش بده تا timescale یکی باشه
    rsiSeries.setData(times.map((t,i) => rsiArr[i]!=null ? {time:t, value:rsiArr[i]} : null).filter(Boolean));
    rsiOB.setData(times.map(t => ({time:t, value:70})));
    rsiOS.setData(times.map(t => ({time:t, value:30})));

    // نقاط پیوت شناسایی‌شده روی RSI (برای اطمینان بصری)
    const rsiMarkers = [];
    divergence.rsiHighs.forEach(i => rsiMarkers.push({ time: times[i], position: 'aboveBar', color: '#ffc107', shape: 'circle' }));
    divergence.rsiLows.forEach(i  => rsiMarkers.push({ time: times[i], position: 'belowBar', color: '#ffc107', shape: 'circle' }));
    rsiMarkers.sort((a,b) => a.time - b.time);
    rsiSeries.setMarkers(rsiMarkers);

    // ── MACD ──
    macdLineSeries.setData(times.map((t,i)   => ml[i]!=null ? {time:t,value:ml[i]} : null).filter(Boolean));
    macdSignalSeries.setData(times.map((t,i) => sl[i]!=null ? {time:t,value:sl[i]} : null).filter(Boolean));
    macdHistSeries.setData(times.map((t,i)   => hl[i]!=null ? {time:t,value:hl[i],color:hl[i]>=0?'#26a69a':'#ef5350'} : null).filter(Boolean));

    // ── Sidebar ──
    renderSidebar({ candles, rsiArr, ml, sl, peaks, valleys, divergence });

    // Legend: نماد + تایم‌فریم + مقادیر آخرین کندل (پیش‌فرض بدون crosshair)
    document.getElementById('lg-symbol').textContent = `${symbol} · ${currentIv.toUpperCase()}`;
    showLastLegend();

    // اندازه چارت‌ها رو دوباره حساب کن (کیبورد موبایل ممکنه ارتفاع صفحه رو عوض کرده باشه)
    resizeChartsNow();

    // به‌جای fitContent (که همه ۳۰۰ کندل رو له می‌کنه تو صفحه)، فقط آخرین کندل‌های اخیر با زوم مناسب نشون داده میشه
    rsiChart.priceScale('right').applyOptions({ autoScale: true });
    macdChart.priceScale('right').applyOptions({ autoScale: true });
    const barsToShow = window.innerWidth <= 768 ? 55 : 120;
    const totalBars = candles.length;
    priceChart.timeScale().setVisibleLogicalRange({
      from: Math.max(0, totalBars - barsToShow),
      to:   totalBars + 3,
    });

    document.getElementById('status').textContent = `${symbol} · ${currentIv} · ${candles.length} کندل`;
  } catch(e) {
    document.getElementById('status').textContent = '❌ ' + e.message;
  } finally {
    document.getElementById('loader').classList.remove('show');
    document.getElementById('loadBtn').disabled = false;
  }
}

// ─── Sidebar ─────────────────────────────────────────────────────────────────
function renderSidebar({ candles, rsiArr, ml, sl, peaks, valleys, divergence }) {
  const fmt  = v => v?.toLocaleString('en-US', {maximumFractionDigits:2}) ?? '—';
  const fmtD = t => new Date(t*1000).toLocaleDateString('fa-IR');

  const rsiClass = v => v==null?'':v>=70?'rsi-ob':v<=30?'rsi-os':'rsi-n';
  const rsiLbl   = v => v==null?'—':v>=70?'اشباع خرید':v<=30?'اشباع فروش':'خنثی';
  const macdClass = i => ml[i]==null||sl[i]==null?'':ml[i]>sl[i]?'macd-bull':'macd-bear';
  const macdLbl   = i => ml[i]==null||sl[i]==null?'—':ml[i]>sl[i]?'صعودی':'نزولی';

  let html = '';

  // Signal — هر سه حالت (نزولی/صعودی/خنثی) به‌صورت یکسان، نواری و فشرده
  if (divergence.bearish) {
    const d = divergence.bearish;
    html += `<div class="pivot-row">
      <div class="status-bar bearish">🔴 نزولی: $${fmt(d.prevPrice)}→$${fmt(d.currentPrice)} (+${d.priceDiff}%)</div>
      <div class="status-bar bearish">RSI: ${(+d.prevRsi).toFixed(1)}→${(+d.currentRsi).toFixed(1)} (${d.rsiDiff})</div>
    </div>`;
  }
  if (divergence.bullish) {
    const d = divergence.bullish;
    html += `<div class="pivot-row">
      <div class="status-bar bullish">🟢 صعودی: $${fmt(d.prevPrice)}→$${fmt(d.currentPrice)} (${d.priceDiff}%)</div>
      <div class="status-bar bullish">RSI: ${(+d.prevRsi).toFixed(1)}→${(+d.currentRsi).toFixed(1)} (+${d.rsiDiff})</div>
    </div>`;
  }
  if (!divergence.bearish && !divergence.bullish) {
    const lastRsi = rsiArr[rsiArr.length - 1];
    html += `<div class="pivot-row">
      <div class="status-bar neutral">⚪ واگرایی شناسایی نشد</div>
      <div class="status-bar ${rsiClass(lastRsi)}">RSI فعلی: ${lastRsi!=null?lastRsi.toFixed(1):'—'} · ${rsiLbl(lastRsi)}</div>
    </div>`;
  }

  // قله‌ها و دره‌ها به صورت جفت (قله | دره) توی هر ردیف کنار هم
  const lastPeaks   = peaks.slice(-3).reverse();
  const lastValleys = valleys.slice(-3).reverse();
  const pairCount = Math.max(lastPeaks.length, lastValleys.length);

  function peakCardHtml(i, idx) {
    const c = candles[i], rv = rsiArr[i];
    const label = idx === 0 ? 'آخرین قله' : `قله ${idx + 1} دوره قبل`;
    return `<div class="pivot-card peak">
      <div class="ptype">▼ ${label}</div>
      <div class="price-val">$${fmt(c.close)}</div>
      <div class="row"><span>تاریخ</span><span>${fmtD(c.time)}</span></div>
      <div class="row"><span>RSI</span><span>${rv!=null?rv.toFixed(1):'—'} <span class="badge ${rsiClass(rv)}">${rsiLbl(rv)}</span></span></div>
      <div class="row"><span>MACD</span><span>${ml[i]!=null?ml[i].toFixed(3):'—'} <span class="badge ${macdClass(i)}">${macdLbl(i)}</span></span></div>
    </div>`;
  }

  function valleyCardHtml(i, idx) {
    const c = candles[i], rv = rsiArr[i];
    const label = idx === 0 ? 'آخرین دره' : `دره ${idx + 1} دوره قبل`;
    return `<div class="pivot-card valley">
      <div class="ptype">▲ ${label}</div>
      <div class="price-val">$${fmt(c.close)}</div>
      <div class="row"><span>تاریخ</span><span>${fmtD(c.time)}</span></div>
      <div class="row"><span>RSI</span><span>${rv!=null?rv.toFixed(1):'—'} <span class="badge ${rsiClass(rv)}">${rsiLbl(rv)}</span></span></div>
      <div class="row"><span>MACD</span><span>${ml[i]!=null?ml[i].toFixed(3):'—'} <span class="badge ${macdClass(i)}">${macdLbl(i)}</span></span></div>
    </div>`;
  }

  for (let idx = 0; idx < pairCount; idx++) {
    const peakHtml   = lastPeaks[idx]   != null ? peakCardHtml(lastPeaks[idx], idx)     : '<div></div>';
    const valleyHtml = lastValleys[idx] != null ? valleyCardHtml(lastValleys[idx], idx) : '<div></div>';
    html += `<div class="pivot-row">${peakHtml}${valleyHtml}</div>`;
  }

  document.getElementById('pivotCards').innerHTML = html || '<p class="no-data">Pivot پیدا نشد</p>';
}

// ─── Boot ────────────────────────────────────────────────────────────────────
applyResponsiveLayout();
initCharts();
populateSymbolDropdown();
// لایه محافظ: دوباره روی window.load هم اجرا میشه، برای اطمینان بیشتر
window.addEventListener('load', applyResponsiveLayout);
</script>
